<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.th{padding:var(--gl-space-6)}
.th .row.between{align-items:flex-start}
.tmeta{display:flex;flex-wrap:wrap;gap:var(--gl-space-2) var(--gl-space-5);margin-top:var(--gl-space-3);font:var(--gl-type-body-sm);color:var(--gl-text-secondary)}
.tmeta span{display:inline-flex;align-items:center;gap:6px}
.tmeta svg.i{width:16px;height:16px;color:var(--gl-text-muted)}
.sys{display:flex;align-items:center;gap:var(--gl-space-3);font:var(--gl-type-caption);color:var(--gl-text-muted)}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--gl-border-default)}
.comp-tabs{display:flex;gap:var(--gl-space-1);padding:var(--gl-space-2) var(--gl-space-3);border-block-end:1px solid var(--gl-border-default)}
.sla-box{display:flex;flex-direction:column;gap:var(--gl-space-3)}
.sla-box .r{display:flex;justify-content:space-between;font:var(--gl-type-body-sm)}
.pre{font:500 12px/20px ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;background:var(--gl-bg-subtle);border-radius:var(--gl-radius-md);padding:var(--gl-space-3);margin-top:var(--gl-space-3);color:var(--gl-text-secondary);white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
GL.mount({
  nav: 'support',
  title: L => '#4821 · ' + L('الدعم', 'Support'),
  render: (L, { icon, fwd, ui }) => `
    <section class="card th">
      <nav class="crumbs"><a href="support.html">${L('الدعم الفني', 'Support')}</a>${fwd('xs')}<span class="cur ltr">#4821</span></nav>
      <div class="row between gap-6">
        <div class="grow"><div class="row gap-3 wrap"><h1 class="t-h1">${L('مشكلة في استيراد بيانات العملاء', 'Customer data import fails')}</h1>${ui.tag('danger', L('عاجلة', 'Urgent'))}${ui.tag('brand', L('قيد المعالجة', 'In progress'))}</div>
          <div class="tmeta"><span>${icon('building')}${L('نيل سوفت للحلول', 'NileSoft Solutions')}</span><span>${icon('user')}${L('أحمد سامي', 'Ahmed Samy')}</span><span>${icon('tag')}${L('خطأ تقني · الاستيراد', 'Bug · Import')}</span><span>${icon('calendar')}${L('اتفتحت اليوم 4:12 م', 'Opened today 4:12 PM')}</span></div></div>
        <div class="row gap-2"><button class="btn btn-outline">${icon('user-plus', 'sm')}${L('تحويل', 'Reassign')}</button><button class="btn btn-primary">${icon('check-circle', 'sm')}${L('تم الحل', 'Resolve')}</button><button class="icon-btn outline">${icon('more')}</button></div>
      </div>
    </section>
    <section class="grid g-12">
      <div class="span-8 mainc">
        <div class="card"><div class="card-body thread">
          <div class="msg">${ui.av(L('أ', 'AS'), 'av-teal', 'round')}<div class="bubble"><div class="hd"><b>${L('أحمد سامي', 'Ahmed Samy')}</b><span>${L('نيل سوفت', 'NileSoft')}</span><span>·</span><span>4:12 PM</span></div>
            <div class="bd">${L('بنحاول نستورد ملف عملاء فيه 2,300 سطر لمشروع «تطبيق Odoo ERP»، الاستيراد بيقف عند 61% ويطلع خطأ. جربنا 3 مرات. العميل مستني البيانات بكرة الصبح.', 'We are importing a 2,300-row customer file into the “Odoo ERP rollout” project. Import stops at 61% with an error. Tried 3 times — the client needs the data tomorrow morning.')}</div>
            <div class="row gap-2 wrap"><span class="att">${icon('file-spreadsheet', 'sm')}<span class="ltr">customers_alnour.xlsx</span><span class="muted">412 KB</span></span><span class="att">${icon('image', 'sm')}<span class="ltr">error.png</span><span class="muted">88 KB</span></span></div></div></div>
          <div class="sys">${L('هند نبيل استلمت التذكرة · 4:20 م', 'Hend Nabil picked up the ticket · 4:20 PM')}</div>
          <div class="msg note">${ui.av(L('ه', 'HN'), 'av-violet', 'round')}<div class="bubble"><div class="hd"><b>${L('هند نبيل', 'Hend Nabil')}</b>${ui.tag('accent', L('ملاحظة داخلية', 'Internal note'), false)}<span>4:31 PM</span></div>
            <div class="bd">${L('اللوج بيقول إن فيه عمود تاريخ بصيغة مختلفة في السطر 1,404. محتاجين نصلح الـ parser يقبل dd/mm/yyyy. فتحت bug للفريق التقني.', 'Logs show a date column in a different format at row 1,404. Parser needs to accept dd/mm/yyyy. Filed a bug with engineering.')}</div>
            <div class="pre">ImportError: row 1404 · col "created_on" · value "23/10/2026"
expected ISO-8601 (YYYY-MM-DD) · job imp_8f2c41 · tenant nilesoft</div></div></div>
          <div class="msg mine">${ui.av(L('ه', 'HN'), 'av-violet', 'round')}<div class="bubble"><div class="hd"><b>${L('هند نبيل', 'Hend Nabil')}</b><span>${L('فريق الدعم', 'Support')}</span><span>·</span><span>4:38 PM</span></div>
            <div class="bd">${L('أهلًا أحمد، لقينا السبب: صيغة التاريخ في عمود created_on. لحد ما نطلق الإصلاح النهارده، تقدر تغيّر صيغة العمود في Excel لـ YYYY-MM-DD وتعيد الاستيراد، وهيكمل عادي.', 'Hi Ahmed — found it: the date format in created_on. Until we ship the fix today, switch that column to YYYY-MM-DD in Excel and re-run the import; it will complete.')}</div></div></div>
        </div></div>
        <div class="composer">
          <div class="comp-tabs"><span class="pill active">${icon('reply', 'sm')}${L('رد على العميل', 'Reply')}</span><span class="pill">${icon('lock', 'sm')}${L('ملاحظة داخلية', 'Internal note')}</span></div>
          <div class="ta">${L('اكتب ردك… استخدم / للردود الجاهزة', 'Write a reply… type / for saved replies')}</div>
          <div class="bar2"><button class="icon-btn sm">${icon('paperclip')}</button><button class="icon-btn sm">${icon('smile')}</button><button class="icon-btn sm">${icon('zap')}</button>
            <div class="end"><span class="t-cap muted">${L('بعد الإرسال:', 'After send:')}</span><span class="control sm sel" style="width:192px"><span class="val">${L('بانتظار العميل', 'Waiting on customer')}</span>${icon('chevron-down', 'sm')}</span><button class="btn btn-primary btn-sm">${icon('send', 'sm flip')}${L('إرسال', 'Send')}</button></div></div>
        </div>
      </div>
      <aside class="span-4 side">
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('تفاصيل التذكرة', 'Ticket details')}</h3></div>
          <div class="card-body pt0 stack gap-4">
            <div class="field"><label>${L('الحالة', 'Status')}</label><span class="control"><span class="val">${L('قيد المعالجة', 'In progress')}</span>${icon('chevron-down', 'sm')}</span></div>
            <div class="field"><label>${L('الأولوية', 'Priority')}</label><span class="control"><span class="prio"><i style="width:8px;height:8px;border-radius:2px;background:var(--gl-danger-solid)"></i></span><span class="val">${L('عاجلة', 'Urgent')}</span>${icon('chevron-down', 'sm')}</span></div>
            <div class="field"><label>${L('المسؤول', 'Assignee')}</label><span class="control"><span class="avatar round av-violet" style="width:22px;height:22px;font-size:10px">${L('ه', 'HN')}</span><span class="val">${L('هند نبيل', 'Hend Nabil')}</span>${icon('chevron-down', 'sm')}</span></div>
          </div></div>
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('الـ SLA', 'SLA')}</h3>${ui.tag('danger', L('متبقي 18 د', '18m left'))}</div>
          <div class="card-body pt0 sla-box">
            <div><div class="r"><span class="sec">${L('أول رد', 'First response')}</span><span class="yes t-strong">${L('تم في 8 د', 'Met in 8m')}</span></div></div>
            <div><div class="r mb"><span class="sec">${L('الحل (4 ساعات · Growth)', 'Resolution (4h · Growth)')}</span><span class="t-strong">3h 42m</span></div><div class="bar danger thin mt-2"><i style="width:92%"></i></div></div>
          </div></div>
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('الشركة', 'Company')}</h3><a class="link" href="company-360.html">${L('ملف 360', 'Open 360')}${fwd('xs')}</a></div>
          <div class="card-body pt0">
            <div class="row gap-3" style="margin-bottom:var(--gl-space-2)"><span class="avatar av-teal">${L('ن', 'NS')}</span><div><div class="t-strong">${L('نيل سوفت للحلول', 'NileSoft Solutions')}</div><div class="dm t-cap muted">nilesoft.example</div></div></div>
            <div class="kv"><span class="k">${L('الخطة', 'Plan')}</span><span class="v">${ui.tag('brand', 'Growth', false)}</span></div>
            <div class="kv"><span class="k">${L('صحة الحساب', 'Health')}</span><span class="v yes">86 / 100</span></div>
            <div class="kv"><span class="k">${L('تذاكر آخر 90 يوم', 'Tickets (90d)')}</span><span class="v">7</span></div>
          </div></div>
      </aside>
    </section>`
});
</script>
</body>
</html>

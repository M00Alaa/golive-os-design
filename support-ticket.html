<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.th{padding:var(--gl-space-6)}
.th .row.between{align-items:flex-start}
.tmeta{display:flex;flex-wrap:wrap;gap:var(--gl-space-2) var(--gl-space-5);margin-top:var(--gl-space-3);font:var(--gl-type-body-sm);color:var(--gl-text-secondary)}
.tmeta span{display:inline-flex;align-items:center;gap:6px}
.tmeta svg.i{width:16px;height:16px;color:var(--gl-text-muted)}
.sys{display:flex;align-items:center;gap:var(--gl-space-3);font:var(--gl-type-caption);color:var(--gl-text-muted)}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--gl-border-default)}
.comp-tabs{display:flex;gap:var(--gl-space-1);padding:var(--gl-space-2) var(--gl-space-3);border-block-end:1px solid var(--gl-border-default)}
.sla-box{display:flex;flex-direction:column;gap:var(--gl-space-3)}
.sla-box .r{display:flex;justify-content:space-between;font:var(--gl-type-body-sm)}
.pre{font:500 12px/20px ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;background:var(--gl-bg-subtle);border-radius:var(--gl-radius-md);padding:var(--gl-space-3);margin-top:var(--gl-space-3);color:var(--gl-text-secondary);white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
GL.mount({
  nav: 'support',
  title: L => '#4821 · ' + L('الدعم', 'Support'),
  me: L => [L('م', 'MA'), 'av-solid', L('محمد علاء', 'Mohamed Alaa')],
  afterSend: v => { const t = document.querySelector('[data-hst]'); const m = { pend: ['warning', GL.L('بانتظار العميل', 'Waiting')], prog: ['brand', GL.L('قيد المعالجة', 'In progress')], solved: ['success', GL.L('محلولة', 'Resolved')] }[v]; if (t && m) t.innerHTML = GL.ui.tag(m[0], m[1]); },
  modals: {
    reassign: { size: 'sm', icon: 'user-plus', title: L => L('تحويل التذكرة', 'Reassign ticket'), sub: () => '#4821',
      body: (L, { ui }) => `${ui.field(L('حوّل إلى', 'Assign to'), ui.select('to', [L('يوسف فريد', 'Youssef Farid'), L('كريم عادل (هندسة)', 'Karim Adel (Engineering)'), L('نورهان رشاد', 'Nourhan Rashad')], { ph: L('اختار عضو', 'Choose a member'), req: 1 }), { req: 1 })}${ui.field(L('ملاحظة للزميل', 'Note for them'), ui.textarea('n', { rows: 3, ph: L('السياق اللي محتاج يعرفه', 'Context they need') }), { opt: L('اختياري', 'optional') })}`,
      submit: L => L('تحويل', 'Reassign'), toast: (L, v) => [L('اتحولت التذكرة', 'Ticket reassigned'), v.to] }
  },
  menus: {
    tkm: [{ icon: 'link', ar: 'نسخ الرابط', en: 'Copy link', toast: L => `success|${L('اتنسخ الرابط', 'Link copied')}|` }, { icon: 'git-branch', ar: 'دمج مع تذكرة تانية', en: 'Merge into…', toast: L => `info|${L('اختار التذكرة للدمج', 'Choose a ticket to merge into')}|` }, { icon: 'printer', ar: 'طباعة', en: 'Print', toast: L => `info|${L('جاري التجهيز للطباعة', 'Preparing to print')}|` }, '-', { icon: 'ban', ar: 'تعليم كسبام', en: 'Mark as spam', confirm: 'spam', danger: 1 }],
    macros: [{ icon: 'zap', ar: 'شكر واستلام', en: 'Thanks, we’re on it', ins: L => L('أهلًا أحمد، شكرًا على التفاصيل. استلمنا التذكرة وبنشتغل عليها دلوقتي وهنرجعلك خلال ساعة.', 'Hi Ahmed, thanks for the details. We’re on it and will update you within the hour.') }, { icon: 'zap', ar: 'محتاجين معلومات أكتر', en: 'Need more info', ins: L => L('ممكن تبعتلنا لقطة شاشة للخطأ ورقم المشروع؟', 'Could you send a screenshot of the error and the project ID?') }, { icon: 'zap', ar: 'تم الإصلاح', en: 'Fix deployed', ins: L => L('الإصلاح اتطلق دلوقتي. جرب الاستيراد تاني وقولنا النتيجة.', 'The fix is live now. Please re-run the import and let us know.') }]
  },
  confirms: {
    resolve: { icon: 'check-circle', title: L => L('تعليم التذكرة كمحلولة؟', 'Mark ticket as resolved?'), text: L => L('هيتبعت للعميل استبيان رضا. لو رد تاني التذكرة هتتفتح تلقائيًا.', 'The customer gets a CSAT survey. A reply reopens the ticket automatically.'), btn: L => L('تم الحل', 'Resolve'), run: L => { document.querySelector('[data-hst]').innerHTML = GL.ui.tag('success', L('محلولة', 'Resolved')); }, toast: L => [L('اتحلت التذكرة', 'Ticket resolved'), ''] },
    spam: { danger: 1, icon: 'ban', title: L => L('تعليم كسبام؟', 'Mark as spam?'), text: L => L('التذكرة هتتقفل والمرسل هيتحظر.', 'The ticket closes and the sender is blocked.'), btn: L => L('سبام', 'Spam'), toast: L => [L('اتعلمت كسبام', 'Marked as spam'), ''] }
  },
  render: (L, { icon, fwd, ui }) => `
    <section class="card th">
      <nav class="crumbs"><a href="support.html">${L('الدعم الفني', 'Support')}</a>${fwd('xs')}<span class="cur ltr">#4821</span></nav>
      <div class="row between gap-6">
        <div class="grow"><div class="row gap-3 wrap"><h1 class="t-h1">${L('مشكلة في استيراد بيانات العملاء', 'Customer data import fails')}</h1>${ui.tag('danger', L('عاجلة', 'Urgent'))}<span data-hst>${ui.tag('brand', L('قيد المعالجة', 'In progress'))}</span></div>
          <div class="tmeta"><span>${icon('building')}${L('نيل سوفت للحلول', 'NileSoft Solutions')}</span><span>${icon('user')}${L('أحمد سامي', 'Ahmed Samy')}</span><span>${icon('tag')}${L('خطأ تقني · الاستيراد', 'Bug · Import')}</span><span>${icon('calendar')}${L('اتفتحت اليوم 4:12 م', 'Opened today 4:12 PM')}</span></div></div>
        <div class="row gap-2"><button class="btn btn-outline" data-open="reassign">${icon('user-plus', 'sm')}${L('تحويل', 'Reassign')}</button><button class="btn btn-primary" data-confirm="resolve">${icon('check-circle', 'sm')}${L('تم الحل', 'Resolve')}</button><button class="icon-btn outline" data-menu="tkm">${icon('more')}</button></div>
      </div>
    </section>
    <section class="grid g-12">
      <div class="span-8 mainc">
        <div class="card"><div class="card-body thread" id="thread">
          <div class="msg">${ui.av(L('أ', 'AS'), 'av-teal', 'round')}<div class="bubble"><div class="hd"><b>${L('أحمد سامي', 'Ahmed Samy')}</b><span>${L('نيل سوفت', 'NileSoft')}</span><span>·</span><span>4:12 PM</span></div>
            <div class="bd">${L('بنحاول نستورد ملف عملاء فيه 2,300 سطر لمشروع «تطبيق Odoo ERP»، الاستيراد بيقف عند 61% ويطلع خطأ. جربنا 3 مرات. العميل مستني البيانات بكرة الصبح.', 'We are importing a 2,300-row customer file into the “Odoo ERP rollout” project. Import stops at 61% with an error. Tried 3 times — the client needs the data tomorrow morning.')}</div>
            <div class="row gap-2 wrap"><span class="att">${icon('file-spreadsheet', 'sm')}<span class="ltr">customers_alnour.xlsx</span><span class="muted">412 KB</span></span><span class="att">${icon('image', 'sm')}<span class="ltr">error.png</span><span class="muted">88 KB</span></span></div></div></div>
          <div class="sys">${L('هند نبيل استلمت التذكرة · 4:20 م', 'Hend Nabil picked up the ticket · 4:20 PM')}</div>
          <div class="msg note">${ui.av(L('ه', 'HN'), 'av-violet', 'round')}<div class="bubble"><div class="hd"><b>${L('هند نبيل', 'Hend Nabil')}</b>${ui.tag('accent', L('ملاحظة داخلية', 'Internal note'), false)}<span>4:31 PM</span></div>
            <div class="bd">${L('اللوج بيقول إن فيه عمود تاريخ بصيغة مختلفة في السطر 1,404. محتاجين نصلح الـ parser يقبل dd/mm/yyyy. فتحت bug للفريق التقني.', 'Logs show a date column in a different format at row 1,404. Parser needs to accept dd/mm/yyyy. Filed a bug with engineering.')}</div>
            <div class="pre">ImportError: row 1404 · col "created_on" · value "23/10/2026"
expected ISO-8601 (YYYY-MM-DD) · job imp_8f2c41 · tenant nilesoft</div></div></div>
          <div class="msg mine">${ui.av(L('ه', 'HN'), 'av-violet', 'round')}<div class="bubble"><div class="hd"><b>${L('هند نبيل', 'Hend Nabil')}</b><span>${L('فريق الدعم', 'Support')}</span><span>·</span><span>4:38 PM</span></div>
            <div class="bd">${L('أهلًا أحمد، لقينا السبب: صيغة التاريخ في عمود created_on. لحد ما نطلق الإصلاح النهارده، تقدر تغيّر صيغة العمود في Excel لـ YYYY-MM-DD وتعيد الاستيراد، وهيكمل عادي.', 'Hi Ahmed — found it: the date format in created_on. Until we ship the fix today, switch that column to YYYY-MM-DD in Excel and re-run the import; it will complete.')}</div></div></div>
        </div></div>
        <div class="composer" data-composer>
          <div class="comp-tabs" data-tabs="cmp"><span class="pill active" data-tab="reply">${icon('reply', 'sm')}${L('رد على العميل', 'Reply')}</span><span class="pill" data-tab="note">${icon('lock', 'sm')}${L('ملاحظة داخلية', 'Internal note')}</span></div>
          <textarea class="ta" rows="3" placeholder="${L('اكتب ردك… Ctrl+Enter للإرسال', 'Write a reply… Ctrl+Enter to send')}"></textarea><div class="row gap-2 wrap" data-files hidden style="padding:0 var(--gl-space-4) var(--gl-space-2)"></div>
          <div class="bar2"><button class="icon-btn sm" data-file="import_log.txt" title="Attach">${icon('paperclip')}</button><button class="icon-btn sm" data-insert="🙏" title="Emoji">${icon('smile')}</button><button class="icon-btn sm" data-menu="macros" title="Saved replies">${icon('zap')}</button>
            <div class="end"><span class="t-cap muted">${L('بعد الإرسال:', 'After send:')}</span><span style="width:200px">${ui.select('after', [['pend', L('بانتظار العميل', 'Waiting on customer')], ['prog', L('قيد المعالجة', 'In progress')], ['solved', L('محلولة', 'Resolved')]], { cls: 'sm' }).replace('<select', '<select data-after')}</span><button class="btn btn-primary btn-sm" data-send="thread">${icon('send', 'sm flip')}${L('إرسال', 'Send')}</button></div></div>
        </div>
      </div>
      <aside class="span-4 side">
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('تفاصيل التذكرة', 'Ticket details')}</h3></div>
          <div class="card-body pt0 stack gap-4">
            ${ui.field(L('الحالة', 'Status'), ui.select('st', [L('جديدة', 'New'), L('مفتوحة', 'Open'), L('قيد المعالجة', 'In progress'), L('بانتظار العميل', 'Waiting'), L('محلولة', 'Resolved')], { val: L('قيد المعالجة', 'In progress'), icon: 'circle-dot' }).replace('<select', '<select data-change-toast'))}
            ${ui.field(L('الأولوية', 'Priority'), ui.select('pr', [L('عاجلة', 'Urgent'), L('عالية', 'High'), L('متوسطة', 'Medium'), L('منخفضة', 'Low')], { icon: 'flag' }).replace('<select', '<select data-change-toast'))}
            ${ui.field(L('المسؤول', 'Assignee'), ui.select('as', [L('هند نبيل', 'Hend Nabil'), L('يوسف فريد', 'Youssef Farid'), L('محمد علاء', 'Mohamed Alaa')], { icon: 'user' }).replace('<select', '<select data-change-toast'))}
          </div></div>
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('الـ SLA', 'SLA')}</h3>${ui.tag('danger', L('متبقي 18 د', '18m left'))}</div>
          <div class="card-body pt0 sla-box">
            <div><div class="r"><span class="sec">${L('أول رد', 'First response')}</span><span class="yes t-strong">${L('تم في 8 د', 'Met in 8m')}</span></div></div>
            <div><div class="r mb"><span class="sec">${L('الحل (4 ساعات · Growth)', 'Resolution (4h · Growth)')}</span><span class="t-strong">3h 42m</span></div><div class="bar danger thin mt-2"><i style="width:92%"></i></div></div>
          </div></div>
        <div class="card"><div class="card-head"><h3 class="t-h3">${L('الشركة', 'Company')}</h3><a class="link" href="company-360.html">${L('ملف 360', 'Open 360')}${fwd('xs')}</a></div>
          <div class="card-body pt0">
            <div class="row gap-3" style="margin-bottom:var(--gl-space-2)"><span class="avatar av-teal">${L('ن', 'NS')}</span><div><div class="t-strong">${L('نيل سوفت للحلول', 'NileSoft Solutions')}</div><div class="dm t-cap muted">nilesoft.example</div></div></div>
            <div class="kv"><span class="k">${L('الخطة', 'Plan')}</span><span class="v">${ui.tag('brand', 'Growth', false)}</span></div>
            <div class="kv"><span class="k">${L('صحة الحساب', 'Health')}</span><span class="v yes">86 / 100</span></div>
            <div class="kv"><span class="k">${L('تذاكر آخر 90 يوم', 'Tickets (90d)')}</span><span class="v">7</span></div>
          </div></div>
      </aside>
    </section>`
});
</script>
</body>
</html>

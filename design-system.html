<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
  .ds-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--gl-space-8);padding:var(--gl-space-10);border-radius:var(--gl-radius-xl);background:radial-gradient(120% 140% at 100% 0%,var(--gl-brand-700) 0%,var(--gl-brand-950) 60%);color:#fff;position:relative;overflow:hidden}
  [dir="ltr"] .ds-hero{background:radial-gradient(120% 140% at 0% 0%,var(--gl-brand-700) 0%,var(--gl-brand-950) 60%)}
  .ds-hero h1{font:var(--gl-type-display);letter-spacing:-.5px}
  .ds-hero p{color:var(--gl-brand-200);margin-top:var(--gl-space-2);max-width:560px;font:var(--gl-type-body-lg)}
  .ds-hero .stats{display:flex;gap:var(--gl-space-8)}
  .ds-hero .stats b{display:block;font:var(--gl-type-h1)}
  .ds-hero .stats span{font:var(--gl-type-caption);color:var(--gl-brand-200)}
  .ramp{display:grid;grid-template-columns:120px repeat(11,minmax(0,1fr));gap:var(--gl-space-2);align-items:center}
  .ramp + .ramp{margin-top:var(--gl-space-4)}
  .ramp .nm{font:var(--gl-type-label)}
  .sw{display:flex;flex-direction:column;gap:6px}
  .sw i{height:48px;border-radius:var(--gl-radius-md);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}
  .sw span{font:var(--gl-type-caption);color:var(--gl-text-muted);direction:ltr;align-self:flex-start}
  .sw span b{display:block;font:var(--gl-type-label-sm);color:var(--gl-text-primary)}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:var(--gl-space-6)}
  .theme-panel{background:var(--gl-bg-canvas);color:var(--gl-text-primary);border:1px solid var(--gl-border-default);border-radius:var(--gl-radius-lg);padding:var(--gl-space-6)}
  .sem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gl-space-2) var(--gl-space-4)}
  .sem-i{display:flex;align-items:center;gap:var(--gl-space-3);padding:var(--gl-space-2);border-radius:var(--gl-radius-md);background:var(--gl-bg-surface);border:1px solid var(--gl-border-default)}
  .sem-i i{width:32px;height:32px;border-radius:var(--gl-radius-sm);flex:none;box-shadow:inset 0 0 0 1px rgb(127 127 127 / .2)}
  .sem-i .code{color:var(--gl-text-primary);font-size:11.5px}
  .type-row{display:grid;grid-template-columns:200px 1fr 1fr;gap:var(--gl-space-6);align-items:center;padding-block:var(--gl-space-4)}
  .type-row + .type-row{border-block-start:1px solid var(--gl-border-default)}
  .type-row .meta{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .type-row .meta b{font:var(--gl-type-label)}
  .space-row{display:grid;grid-template-columns:120px 64px 1fr;align-items:center;gap:var(--gl-space-4);padding-block:6px}
  .space-row i{display:block;height:16px;border-radius:4px;background:color-mix(in srgb,var(--gl-brand-primary) 70%,transparent)}
  .rad{display:flex;flex-direction:column;align-items:center;gap:var(--gl-space-3)}
  .rad i{width:96px;height:96px;background:var(--gl-brand-subtle);border:2px solid var(--gl-brand-primary)}
  .shd{height:96px;border-radius:var(--gl-radius-lg);background:var(--gl-bg-surface);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--gl-space-4);gap:2px}
  .comp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gl-space-6)}
  .comp-grid .full{grid-column:1 / -1}
  .bidi{display:grid;grid-template-columns:1fr 1fr;gap:var(--gl-space-6)}
  .bidi > div{display:flex;flex-direction:column;gap:var(--gl-space-4);padding:var(--gl-space-6);border-radius:var(--gl-radius-lg);background:var(--gl-bg-canvas);border:1px solid var(--gl-border-default)}
  .mini-side{overflow:hidden;background:var(--gl-bg-sidebar);border-radius:var(--gl-radius-lg);padding:var(--gl-space-4);display:flex;flex-direction:column;gap:var(--gl-space-1);width:264px}
  .mini-side .nav-item.active::before{inset-inline-start:calc(var(--gl-space-4) * -1)}
  .ix-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gl-space-6)}
  .ix-grid .full{grid-column:1/-1}
  .ix-btns{display:flex;flex-wrap:wrap;gap:var(--gl-space-2)}
  .ix-static{display:flex;flex-direction:column;gap:var(--gl-space-3);align-items:flex-start}
  .ix-static .toast{position:static;animation:none;width:100%;max-width:420px}
  .ix-modal{border:1px solid var(--gl-border-default);border-radius:var(--gl-radius-lg);background:var(--gl-bg-surface);box-shadow:var(--gl-shadow-lg);overflow:hidden}
  .ix-modal .ov-head{display:flex;gap:var(--gl-space-3);padding:var(--gl-space-4) var(--gl-space-5);border-block-end:1px solid var(--gl-border-default)}
  .ix-modal .ov-foot{display:flex;justify-content:flex-end;gap:var(--gl-space-2);padding:var(--gl-space-3) var(--gl-space-5);background:var(--gl-bg-subtle);border-block-start:1px solid var(--gl-border-default)}
  .ix-modal .ov-body{padding:var(--gl-space-5);display:flex;flex-direction:column;gap:var(--gl-space-4)}
  .ix-ref td:first-child{font-family:ui-monospace,Menlo,monospace;font-size:12px;direction:ltr;unicode-bidi:isolate;white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word}
  .ix-thread{display:flex;flex-direction:column;gap:var(--gl-space-3);max-height:240px;overflow:auto}
  .ix-steps .stepper{justify-content:flex-start}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
const RAMPS = {
  brand: ['50','100','200','300','400','500','600','700','800','900','950'],
  neutral: ['50','100','200','300','400','500','600','700','800','900','950'],
};
const HEX = {brand:['#ECFDF8','#D1FAEE','#A6F2DD','#6EE4C7','#34CDAB','#12B293','#0A8F78','#0A7363','#0D5B50','#0E4B43','#042E29'],
  neutral:['#F4F7F6','#ECF0EF','#DFE5E4','#C5CECD','#93A09E','#677573','#4A5755','#353F3E','#232B2A','#131918','#0B100F']};
const STATUS = [['accent',['100','300','500','600','950'],['#FFF1D6','#FFCB6B','#F5A524','#D98A0B','#2E2108']],['green',['50','400','600','700','950'],['#ECFDF3','#4ADE80','#16A34A','#15803D','#0E2A1A']],['red',['50','400','600','700','950'],['#FEF2F2','#F87171','#DC2626','#B91C1C','#2F1315']],['amber',['50','400','600','700','950'],['#FFF8EB','#FBBF24','#D97706','#B45309','#2E2108']],['blue',['50','400','600','700','950'],['#EFF6FF','#60A5FA','#2563EB','#1D4ED8','#0F1D38']],['violet',['50','400','600','950'],['#F5F3FF','#A78BFA','#7C3AED','#1E1538']]];
const SEM = ['bg-canvas','bg-surface','bg-subtle','bg-sidebar','border-default','border-strong','text-primary','text-secondary','text-muted','brand-primary','brand-subtle','brand-text','accent-default','accent-subtle','success-solid','warning-solid','danger-solid','info-solid'];
const TYPE = [['display','Display','700 · 32/44'],['h1','Heading 1','600 · 24/36'],['h2','Heading 2','600 · 20/30'],['h3','Heading 3','500 · 16/26'],['body-lg','Body large','400 · 16/26'],['body','Body','400 · 14/22'],['body-strong','Body strong','500 · 14/22'],['body-sm','Body small','400 · 13/20'],['label','Label','500 · 13/20'],['caption','Caption','400 · 12/18'],['overline','Overline','600 · 11/16'],['kpi','KPI value','600 · 28/36']];
GL.mount({
  doc: 'ds',
  title: L => L('نظام التصميم', 'Design System'),
  modals: {
    dm: { icon: 'building', title: L => L('إضافة شركة', 'Add company'), sub: L => L('مودال متوسط · Enter للحفظ · Esc للإغلاق', 'Medium modal · Enter saves · Esc closes'),
      body: (L, { ui }) => `${ui.field(L('اسم الشركة', 'Company name'), ui.input('name', { req: 1, ph: L('مثلًا: نيل سوفت', 'e.g. NileSoft') }), { req: 1 })}<div class="form-grid">${ui.field(L('الإيميل', 'Email'), ui.input('email', { req: 1, type: 'email', ltr: 1, icon: 'mail' }), { req: 1 })}${ui.field(L('الخطة', 'Plan'), ui.select('plan', ['Starter', 'Growth', 'Enterprise'], { req: 1, ph: L('اختار', 'Choose') }), { req: 1 })}</div>`,
      submit: L => L('إضافة', 'Add'), add: { table: 'dsTbl', prepend: true, row: (v, L) => `<tr data-row data-cat="trial"><td class="t-strong" data-f="name">${v.name.replace(/</g, '&lt;')}</td><td>${v.plan}</td><td>${GL.ui.tag('info', L('تجربة', 'Trial'))}</td><td class="right">${GL.ui.menuBtn('dsm')}</td></tr>` }, toast: (L, v) => [L('اتضافت الشركة', 'Company added'), v.name] },
    dd: { kind: 'drawer', size: 'lg', icon: 'sliders-horizontal', title: L => L('درج جانبي', 'Drawer'), sub: L => L('للتفاصيل والنماذج الطويلة · بيفتح من ناحية النهاية', 'For details and long forms · opens from the inline end'),
      body: (L, { ui }) => `${ui.field(L('الحالة', 'Status'), `<div class="row gap-2" data-pick><span class="opt on">${L('نشطة', 'Active')}</span><span class="opt">${L('تجربة', 'Trial')}</span><span class="opt">${L('موقوفة', 'Suspended')}</span></div>`)}${ui.field(L('ملاحظات', 'Notes'), ui.textarea('n', { rows: 5, req: 1 }), { req: 1 })}<label class="check t-sm"><span class="box on">${GL.icon('check')}</span>${L('بلّغ العميل', 'Notify the client')}</label>`,
      footNote: L => L('آخر تعديل من دقيقتين', 'Last edited 2 min ago'), submit: L => L('حفظ', 'Save') },
    edit: { icon: 'pencil', title: L => L('تعديل', 'Edit'), body: (L, { ui }) => ui.field(L('الاسم', 'Name'), ui.input('name', { req: 1 }), { req: 1 }), submit: L => L('حفظ', 'Save'), toast: (L, v) => [L('اتحفظ', 'Saved'), v.name] }
  },
  menus: { dsm: [{ icon: 'pencil', ar: 'تعديل', en: 'Edit', open: 'edit' }, { icon: 'copy', ar: 'نسخ', en: 'Duplicate', toast: (L, n) => `success|${L('اتعملت نسخة', 'Duplicated')}|${n}` }, { icon: 'pause', ar: 'إيقاف', en: 'Suspend', confirm: 'dc' }, '-', { icon: 'trash-2', ar: 'حذف', en: 'Delete', del: 1, danger: 1 }] },
  confirms: {
    dc: { icon: 'pause', title: L => L('إيقاف الحساب؟', 'Suspend this account?'), text: L => L('تأكيد بسيط بزرار أساسي. بيتقفل بـ Esc.', 'A simple confirm with a primary action. Esc closes it.'), btn: L => L('إيقاف', 'Suspend'), toast: L => [L('اتوقف الحساب', 'Account suspended'), '', 'warning'] },
    dx: { danger: 1, title: L => L('حذف نهائي؟', 'Delete permanently?'), text: L => L('للأفعال اللي مينفعش تترجع: اكتب الاسم عشان الزرار يشتغل.', 'For irreversible actions: type the name to enable the button.'), type: () => 'nilesoft', btn: L => L('حذف', 'Delete'), toast: L => [L('اتحذف', 'Deleted'), 'nilesoft', 'danger'] }
  },
  render: (L, { icon, fwd, back }) => {
    const sec = (over, title, desc, body) => `<section class="ds-sec"><header><div class="t-over">${over}</div><h2>${title}</h2>${desc ? `<p>${desc}</p>` : ''}</header>${body}</section>`;
    const card = (label, body, cls) => `<div class="ds-card ${cls || ''}"><div class="ds-label">${label}</div>${body}</div>`;
    const ramp = (name, steps, hexes) => `<div class="ramp" style="grid-template-columns:120px repeat(${steps.length},minmax(0,1fr))"><span class="nm">${name}</span>${steps.map((s, i) => `<div class="sw"><i style="background:var(--gl-${name}-${s})"></i><span><b>${s}</b>${hexes[i]}</span></div>`).join('')}</div>`;
    const semPanel = th => `<div class="theme-panel" data-theme="${th}"><div class="row between" style="margin-bottom:var(--gl-space-4)"><span class="t-h3">${th === 'light' ? L('الوضع الفاتح', 'Light') : L('الوضع الغامق', 'Dark')}</span>${icon(th === 'light' ? 'sun' : 'moon', 'sm')}</div>
      <div class="sem">${SEM.map(s => `<div class="sem-i"><i style="background:var(--gl-${s})"></i><span class="code">--gl-${s}</span></div>`).join('')}</div></div>`;
    const sample = L('منصة واحدة لإدارة تنفيذ المشاريع', 'One platform to run every go-live');
    const comps = `
      <div class="comp-grid">
        ${card(L('الأزرار', 'Buttons'), `
          <div class="ds-row"><button class="btn btn-primary">${icon('plus', 'sm')}${L('إضافة شركة', 'Add company')}</button><button class="btn btn-secondary">${L('ثانوي', 'Secondary')}</button><button class="btn btn-outline">${L('محدد', 'Outline')}</button><button class="btn btn-ghost">${L('شفاف', 'Ghost')}</button><button class="btn btn-danger">${L('حذف', 'Delete')}</button></div>
          <div class="ds-row" style="margin-top:var(--gl-space-4)"><button class="btn btn-primary btn-sm">${L('صغير', 'Small')}</button><button class="btn btn-outline btn-sm">${icon('download', 'sm')}${L('تصدير', 'Export')}</button><button class="btn btn-primary is-hover">${L('تمرير', 'Hover')}</button><button class="btn btn-primary" disabled>${L('معطل', 'Disabled')}</button><button class="btn btn-accent">${icon('rocket', 'sm')}Go-live</button></div>
          <div class="ds-row" style="margin-top:var(--gl-space-4)"><button class="icon-btn outline">${icon('filter')}</button><button class="icon-btn">${icon('more')}</button><button class="icon-btn outline sm">${icon('pencil')}</button><button class="icon-btn bell">${icon('bell')}</button></div>`)}
        ${card(L('حقول الإدخال', 'Inputs'), `
          <div class="grid g-2" style="gap:var(--gl-space-4)">
            <div class="field"><label>${L('اسم الشركة', 'Company name')}</label><div class="control"><input placeholder="${L('مثال: نيل سوفت', 'e.g. NileSoft')}"></div><span class="hint">${L('هيظهر في بوابة العميل', 'Shown on the client portal')}</span></div>
            <div class="field"><label>${L('البريد الإلكتروني', 'Email')}</label><div class="control is-focus">${icon('mail', 'sm')}<span class="val ltr" style="text-align:start">ahmed@nilesoft.example</span></div><span class="hint">${L('حالة التركيز', 'Focus state')}</span></div>
            <div class="field"><label>${L('الدومين', 'Domain')}</label><div class="control is-error"><span class="val">nilesoft</span>${icon('alert-circle', 'sm')}</div><span class="err">${L('الدومين غير صالح', 'Enter a valid domain')}</span></div>
            <div class="field"><label>${L('الخطة', 'Plan')}</label><div class="control"><span class="val">Growth — $179</span>${icon('chevron-down', 'sm')}</div><span class="hint">${L('قائمة اختيار', 'Select')}</span></div>
            <div class="field"><label>${L('بحث', 'Search')}</label><div class="control">${icon('search', 'sm')}<span class="val ph">${L('ابحث…', 'Search…')}</span><span class="kbd">Ctrl K</span></div></div>
            <div class="field"><label>${L('معطل', 'Disabled')}</label><div class="control is-disabled"><span class="val ph">${L('غير متاح', 'Not available')}</span></div></div>
          </div>`)}
        ${card(L('الاختيارات', 'Selection'), `
          <div class="ds-row" style="gap:var(--gl-space-6)"><span class="check"><span class="box"></span>${L('غير محدد', 'Unchecked')}</span><span class="check"><span class="box on">${icon('check')}</span>${L('محدد', 'Checked')}</span><span class="check"><span class="box on ind"></span>${L('جزئي', 'Indeterminate')}</span></div>
          <div class="ds-row" style="gap:var(--gl-space-6);margin-top:var(--gl-space-5)"><span class="check"><span class="switch"></span>${L('إيقاف', 'Off')}</span><span class="check"><span class="switch on"></span>${L('تشغيل', 'On')}</span></div>
          <div style="margin-top:var(--gl-space-5)" class="pills"><span class="pill">${L('يومي', 'Daily')}</span><span class="pill active">${L('شهري', 'Monthly')}</span><span class="pill">${L('سنوي', 'Yearly')}</span></div>`)}
        ${card(L('الوسوم والشارات', 'Tags, badges & avatars'), `
          <div class="ds-row"><span class="tag success"><span class="dot"></span>${L('نشطة', 'Active')}</span><span class="tag warning"><span class="dot"></span>${L('متأخرة', 'Past due')}</span><span class="tag danger"><span class="dot"></span>${L('ملغاة', 'Cancelled')}</span><span class="tag info"><span class="dot"></span>${L('تجريبية', 'Trial')}</span><span class="tag neutral">Starter</span><span class="tag brand">Growth</span><span class="tag violet">Enterprise</span><span class="tag accent">${L('جديد', 'New')}</span></div>
          <div class="ds-row" style="margin-top:var(--gl-space-5)"><span class="badge">12</span><span class="badge brand">3</span><span class="badge soft">128</span>
            <span style="width:var(--gl-space-4)"></span><span class="avatar sm av-teal">ن</span><span class="avatar av-blue">${L('د', 'DE')}</span><span class="avatar av-violet">${L('س', 'AC')}</span><span class="avatar av-amber">${L('م', 'MT')}</span><span class="avatar lg av-teal">${L('ن', 'NS')}</span><span class="avatar round av-solid">${L('م', 'M')}</span></div>`)}
        ${card(L('التبويبات', 'Tabs'), `
          <div class="tabs"><span class="tab active">${L('نظرة عامة', 'Overview')}</span><span class="tab">${L('المستخدمين', 'Users')} <span class="badge">24</span></span><span class="tab">${L('المشاريع', 'Projects')} <span class="badge">7</span></span><span class="tab">${L('الفواتير', 'Billing')}</span></div>
          <div class="ds-label" style="margin-top:var(--gl-space-6)">${L('شريط التقدم', 'Progress')}</div>
          <div class="stack gap-3"><div class="bar"><i style="width:72%"></i></div><div class="bar warn"><i style="width:90%"></i></div><div class="bar danger thin"><i style="width:35%"></i></div></div>
          <div class="ds-label" style="margin-top:var(--gl-space-6)">${L('ترقيم الصفحات', 'Pagination')}</div>
          <div class="pager"><span class="pg nav">${back('sm')}</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">…</span><span class="pg">16</span><span class="pg nav">${fwd('sm')}</span></div>`)}
        ${card(L('عناصر القائمة الجانبية', 'Navigation'), `
          <div class="mini-side">
            <a class="nav-item">${icon('dashboard')}<span>${L('نظرة عامة', 'Overview')}</span></a>
            <a class="nav-item active">${icon('building')}<span>${L('الشركات', 'Companies')}</span></a>
            <a class="nav-item" style="background:rgb(255 255 255 / .05);color:#fff">${icon('layers')}<span>${L('الخطط (تمرير)', 'Plans (hover)')}</span></a>
            <a class="nav-item">${icon('life-buoy')}<span>${L('الدعم الفني', 'Support')}</span><span class="count">12</span></a>
          </div>`)}
        ${card(L('بطاقة مؤشر', 'KPI card'), `
          <div class="card kpi" style="max-width:300px">
            <div class="kpi-top"><span class="kpi-label">${L('الإيراد الشهري المتكرر', 'Monthly recurring revenue')}</span><span class="kpi-icon">${icon('credit-card')}</span></div>
            <span class="kpi-val ltr" style="text-align:start">$18,420</span>
            <div class="kpi-foot"><span class="delta up">${icon('trending-up')}12.4%</span><span>${L('مقارنة بالشهر الماضي', 'vs last month')}</span></div>
          </div>`)}
        ${card(L('الإشعارات', 'Toasts'), `
          <div class="stack gap-3">
            <div class="toast success"><span class="ic">${icon('check-circle', 'sm')}</span><div><div class="ttl">${L('تم حفظ التغييرات', 'Changes saved')}</div><div class="msg">${L('تم تحديث خطة نيل سوفت إلى Growth.', 'NileSoft was moved to Growth.')}</div></div><button class="icon-btn sm">${icon('x')}</button></div>
            <div class="toast danger"><span class="ic">${icon('alert-circle', 'sm')}</span><div><div class="ttl">${L('فشل تحصيل الدفع', 'Payment failed')}</div><div class="msg">${L('البطاقة المنتهية بـ 4242 مرفوضة.', 'Card ending 4242 was declined.')}</div></div><button class="icon-btn sm">${icon('x')}</button></div>
          </div>`)}
        ${card(L('الحالة الفارغة', 'Empty state'), `
          <div class="empty"><span class="empty-ic">${icon('inbox')}</span><h3 class="t-h3">${L('مفيش تذاكر مفتوحة', 'No open tickets')}</h3><p class="t-sm">${L('أول ما عميل يفتح تذكرة دعم هتظهر هنا.', 'When a customer opens a ticket it will show up here.')}</p><button class="btn btn-outline btn-sm">${icon('refresh', 'sm')}${L('تحديث', 'Refresh')}</button></div>`)}
        ${card(L('الجدول', 'Table'), `
          <div class="card table-wrap" style="box-shadow:none"><table class="tbl compact"><colgroup><col><col style="width:110px"><col style="width:120px"></colgroup>

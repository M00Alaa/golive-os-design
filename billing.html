<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.chart{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--gl-space-3);height:232px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font:var(--gl-type-caption);color:var(--gl-text-muted);text-align:end;padding-bottom:26px;direction:ltr}
.plot{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gl-space-3);align-items:end;padding-bottom:26px;background:repeating-linear-gradient(to top,var(--gl-chart-grid) 0 1px,transparent 1px 25%);background-size:100% calc(100% - 26px);background-repeat:no-repeat}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.stk{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.stk i{display:block}
.col .lb{position:absolute;bottom:-24px;font:var(--gl-type-caption);color:var(--gl-text-muted);white-space:nowrap}
.col.cur .lb{color:var(--gl-text-primary);font-weight:500}
.dun{display:flex;align-items:center;gap:var(--gl-space-3);padding-block:var(--gl-space-3)}
.dun + .dun{border-block-start:1px solid var(--gl-border-default)}
.att-n{font:var(--gl-type-caption);color:var(--gl-text-muted)}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
GL.mount({
  nav: 'billing',
  modals: {
    invoice: { kind: 'drawer', icon: 'receipt', title: (L, c) => c.name || 'INV-2026-1184', sub: (L, c) => c.co || L('نيل سوفت للحلول', 'NileSoft Solutions'),
      body: (L, { ui, ctx }) => `<div class="row gap-3"><div class="grow"><div class="t-cap muted">${L('المبلغ', 'Amount')}</div><div class="t-h1 ltr">${ctx.amt || '$179.00'}</div></div><span data-st>${ctx.stHtml || ui.tag('success', L('مدفوعة', 'Paid'))}</span></div>
        <div class="card" style="box-shadow:none"><div class="card-body">
          <div class="kv"><span class="k">${L('تاريخ الإصدار', 'Issued')}</span><span class="v">${ctx.iss || L('1 نوف 2026', 'Nov 1, 2026')}</span></div>
          <div class="kv"><span class="k">${L('الاستحقاق', 'Due')}</span><span class="v">${ctx.due || L('1 نوف 2026', 'Nov 1, 2026')}</span></div>
          <div class="kv"><span class="k">${L('طريقة الدفع', 'Payment method')}</span><span class="v ltr">Visa •••• 4242</span></div>
          <div class="kv"><span class="k">${L('مرجع Stripe', 'Stripe ref')}</span><span class="v ltr">pi_3Q…8fK2</span></div></div></div>
        <div class="sec-title">${L('البنود', 'Line items')}</div>
        <table class="tbl"><colgroup><col><col style="width:64px"><col style="width:112px"></colgroup><thead><tr><th>${L('البند', 'Item')}</th><th>${L('كمية', 'Qty')}</th><th>${L('المبلغ', 'Amount')}</th></tr></thead><tbody>
          <tr><td>${L('خطة', 'Plan')} ${ctx.plan || 'Growth'} · ${L('شهري', 'Monthly')}</td><td class="num">1</td><td class="money">${ctx.amt || '$179.00'}</td></tr>
          <tr><td>${L('ضريبة القيمة المضافة (0%)', 'VAT (0%)')}</td><td class="num">—</td><td class="money">$0.00</td></tr>
          <tr><td class="t-strong">${L('الإجمالي', 'Total')}</td><td></td><td class="money t-strong">${ctx.amt || '$179.00'}</td></tr></tbody></table>
        <div class="sec-title">${L('السجل', 'History')}</div>
        <div class="tl"><div class="tl-i"><div class="t">${L('اتدفعت تلقائيًا', 'Paid automatically')}</div><div class="d">${ctx.iss || L('1 نوف', 'Nov 1')}, 09:00</div></div><div class="tl-i muted-dot"><div class="t">${L('اتبعتت للعميل', 'Sent to customer')}</div><div class="d">${ctx.iss || L('1 نوف', 'Nov 1')}, 08:58</div></div><div class="tl-i muted-dot"><div class="t">${L('اتعملت الفاتورة', 'Invoice created')}</div><div class="d">${ctx.iss || L('1 نوف', 'Nov 1')}, 08:58</div></div></div>`,
      foot: L => `<button type="button" class="btn btn-ghost" data-open="refund">${GL.icon('rotate-ccw', 'sm')}${L('استرداد', 'Refund')}</button><span class="grow"></span><button type="button" class="btn btn-outline" data-toast="success|${L('اتبعتت الفاتورة', 'Invoice resent')}|">${GL.icon('mail', 'sm')}${L('إعادة إرسال', 'Resend')}</button><button type="button" class="btn btn-primary" data-toast="success|${L('جاري التحميل', 'Downloading')}|PDF">${GL.icon('download', 'sm')}PDF</button>` },
    refund: { icon: 'rotate-ccw', tone: 'warning', title: L => L('استرداد مبلغ', 'Issue refund'), sub: (L, c) => (c.name || '') + (c.co ? ' · ' + c.co : ''),
      body: (L, { ui, ctx }) => `<div class="form-grid">${ui.field(L('المبلغ (USD)', 'Amount (USD)'), ui.input('amount', { req: 1, ltr: 1, val: (ctx.amt || '').replace('$', ''), icon: 'banknote' }), { req: 1, hint: L('الحد الأقصى قيمة الفاتورة', 'Up to the invoice total') })}${ui.field(L('النوع', 'Type'), ui.select('type', [L('كامل', 'Full'), L('جزئي', 'Partial')]))}${ui.field(L('السبب', 'Reason'), ui.select('reason', [L('دفع مكرر', 'Duplicate charge'), L('طلب العميل', 'Customer request'), L('مشكلة في الخدمة', 'Service issue')], { ph: L('اختار السبب', 'Choose a reason'), req: 1 }), { req: 1, full: 1 })}${ui.field(L('ملاحظة داخلية', 'Internal note'), ui.textarea('note', { rows: 3 }), { full: 1, opt: L('اختياري', 'optional') })}</div><label class="check"><span class="box on">${GL.icon('check')}</span>${L('ابعت إيصال الاسترداد للعميل', 'Email a refund receipt to the customer')}</label>`,
      submit: L => L('استرداد', 'Refund'), onSubmit: (v, { row }) => { if (row && row.querySelector('[data-st]')) row.querySelector('[data-st]').innerHTML = GL.ui.tag('neutral', GL.L('مستردة', 'Refunded')); document.querySelectorAll('.ovl').forEach(o => o.remove()); }, toast: (L, v) => [L('اتعمل الاسترداد', 'Refund issued'), '$' + v.amount + L(' · بيوصل خلال 5–10 أيام', ' · arrives in 5–10 days')] },
    cancel: { icon: 'circle-x', tone: 'danger', danger: 1, title: L => L('إلغاء الاشتراك', 'Cancel subscription'), sub: (L, c) => c.name,

      submit: L => L('إلغاء الاشتراك', 'Cancel subscription'), onSubmit: (v, { row }) => { if (row) row.querySelector('[data-st]').innerHTML = GL.ui.tag('warning', GL.L('هيتلغى 12 ديس', 'Cancels Dec 12')); }, toast: L => [L('الاشتراك هيتلغى', 'Subscription set to cancel'), ''] }

    range: [{ icon: 'calendar', ar: 'آخر 30 يوم', en: 'Last 30 days', toast: L => `info|${L('الفترة: آخر 30 يوم', 'Range: last 30 days')}|` }, { icon: 'calendar', ar: 'آخر 3 شهور', en: 'Last quarter', toast: L => `info|${L('الفترة: آخر 3 شهور', 'Range: last quarter')}|` }, { icon: 'calendar', ar: 'آخر 12 شهر', en: 'Last 12 months', toast: L => `info|${L('الفترة: آخر 12 شهر', 'Range: last 12 months')}|` }, { icon: 'calendar-range', ar: 'فترة مخصصة…', en: 'Custom range…', toast: L => `info|${L('اختار الفترة', 'Pick a range')}|` }]
  },
  confirms: {
    paid: { icon: 'check-circle', title: (L, c) => L(`تعليم ${c.name} كمدفوعة؟`, `Mark ${c.name} as paid?`), text: L => L('استخدمها لو الدفع اتعمل بره Stripe (تحويل بنكي مثلًا).', 'Use this when payment happened outside Stripe, e.g. bank transfer.'), btn: L => L('تعليم كمدفوعة', 'Mark paid'), run: (L, c, row) => { row.querySelector('[data-st]').innerHTML = GL.ui.tag('success', L('مدفوعة', 'Paid')); GLI.flash(row); }, toast: (L, c) => [L('اتعلمت كمدفوعة', 'Marked as paid'), c.name] },
    retry: { icon: 'refresh', title: (L, c) => L(`إعادة محاولة التحصيل من ${c.name}؟`, `Retry the charge for ${c.name}?`), text: L => L('هنحاول نسحب المبلغ من الكارت المسجل دلوقتي.', 'We’ll try the card on file right now.'), btn: L => L('إعادة المحاولة', 'Retry now'), run: (L, c, row) => { const s = row.querySelector('[data-st]'); if (s) s.innerHTML = GL.ui.tag('success', L('اتحصلت', 'Recovered')); GLI.flash(row); }, toast: (L, c) => [L('الدفع نجح', 'Payment succeeded'), c.name] }
  },
  title: L => L('الاشتراكات والفواتير', 'Subscriptions & Billing'),
  render: (L, { icon, ui }) => {
    const months = L(['ديس', 'ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف'], ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov']);
    const data = [[2.1, 4.6, .8], [2.4, 5.4, .8], [2.6, 6.1, 1.2], [3, 6.8, 1.2], [3.1, 7.3, 1.6], [3.5, 8, 1.6], [3.7, 8.6, 1.6], [4, 9.3, 1.7], [4.2, 9.9, 2.1], [4.4, 10.4, 2.1], [4.6, 11, 2.1], [4.8, 11.5, 2.1]];
    const max = 20;
    const colors = ['var(--gl-brand-300)', 'var(--gl-brand-600)', 'var(--gl-accent-500)'];
    const st = { paid: ['success', L('مدفوعة', 'Paid')], open: ['info', L('مستحقة', 'Open')], over: ['danger', L('متأخرة', 'Overdue')], ref: ['neutral', L('مستردة', 'Refunded')] };
    const inv = [
      ['INV-2026-1184', L('نيل سوفت للحلول', 'NileSoft Solutions'), 'nilesoft.example', 'av-teal', L('ن', 'NS'), 'Growth', '$179.00', L('1 نوف', 'Nov 1'), L('1 نوف', 'Nov 1'), 'paid'],
      ['INV-2026-1183', L('سحابة الأهرام', 'Ahram Cloud'), 'ahram-cloud.example', 'av-violet', L('س', 'AC'), 'Enterprise', '$420.00', L('1 نوف', 'Nov 1'), L('15 نوف', 'Nov 15'), 'paid'],
      ['INV-2026-1179', L('مدار للتقنية', 'Madar Tech'), 'madar-tech.example', 'av-amber', L('م', 'MT'), 'Growth', '$179.00', L('27 أكت', 'Oct 27'), L('10 نوف', 'Nov 10'), 'over'],
      ['INV-2026-1176', L('بوابة الشرق للاستشارات', 'Sharq Gate Consulting'), 'sharq-gate.example', 'av-blue', L('ب', 'SG'), 'Growth', '$1,718.40', L('14 أكت', 'Oct 14'), L('28 نوف', 'Nov 28'), 'open'],
      ['INV-2026-1171', L('رؤية للأنظمة المتكاملة', 'Roya Integrated Systems'), 'roya-systems.example', 'av-teal', L('ر', 'RI'), 'Starter', '$79.00', L('9 أكت', 'Oct 9'), L('9 أكت', 'Oct 9'), 'paid'],
      ['INV-2026-1168', L('ثقة لحلول الأعمال', 'Thiqa Business Solutions'), 'thiqa.example', 'av-amber', L('ث', 'TB'), 'Starter', '$79.00', L('2 أكت', 'Oct 2'), L('2 أكت', 'Oct 2'), 'ref'],
      ['INV-2026-1162', L('النخبة لتقنية الأعمال', 'Nokhba Business Tech'), 'nokhba.example', 'av-violet', L('ن', 'NB'), 'Growth', '$179.00', L('28 سبت', 'Sep 28'), L('28 سبت', 'Sep 28'), 'paid']
    ];
    const dunning = [
      [L('مدار للتقنية', 'Madar Tech'), 'av-amber', L('م', 'MT'), '$179', L('الكارت مرفوض · محاولة 3 من 4', 'Card declined · attempt 3 of 4'), 'danger'],
      [L('المسار الذكي', 'Smart Path'), 'av-blue', L('م', 'SP'), '$79', L('الكارت انتهى · محاولة 1 من 4', 'Card expired · attempt 1 of 4'), 'warning'],
      [L('أطلس للحلول', 'Atlas Solutions'), 'av-teal', L('أ', 'AS'), '$179', L('رصيد غير كافٍ · محاولة 2 من 4', 'Insufficient funds · attempt 2 of 4'), 'warning']
    ];
    return `
    <div class="page-head">
      <div><h1 class="t-h1">${L('الاشتراكات والفواتير', 'Subscriptions & Billing')}</h1><p class="sub">${L('الإيرادات المتكررة والفواتير ومحاولات التحصيل لكل الشركات', 'Recurring revenue, invoices and collections across all companies')}</p></div>

      <div class="span-8 card">
        <div class="card-head"><div><h3 class="t-h3">${L('الإيراد الشهري حسب الخطة', 'MRR by plan')}</h3><p class="sub">${L('بالآلاف (USD)', 'In thousands (USD)')}</p></div>
          <div class="row gap-4"><span class="legend"><i style="background:${colors[0]}"></i>Starter</span><span class="legend"><i style="background:${colors[1]}"></i>Growth</span><span class="legend"><i style="background:${colors[2]}"></i>Enterprise</span></div></div>
        <div class="card-body pt0"><div class="chart"><div class="yax"><span>$20K</span><span>$15K</span><span>$10K</span><span>$5K</span><span>0</span></div>

      </div>

        <div class="card-head"><div><h3 class="t-h3">${L('محاولات التحصيل', 'Dunning queue')}</h3><p class="sub">${L('مدفوعات فشلت وبيتعاد تحصيلها تلقائيًا', 'Failed payments being retried automatically')}</p></div></div>
        <div class="card-body pt0">${dunning.map(d => `<div class="dun">${ui.av(d[2], d[1], 'sm')}<div class="grow"><div class="t-strong ell">${d[0]}</div><div class="att-n">${d[4]}</div></div><span class="tag ${d[5]} ltr">${d[3]}</span></div>`).join('')}
          <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:var(--gl-space-2)" data-goto="bt:failed">${L('عرض التفاصيل', 'View details')}</button><button class="btn btn-outline btn-sm" style="width:100%;margin-top:var(--gl-space-2)" data-toast="success|${L('اتبعت 3 تذكيرات', '3 reminders sent')}|">${icon('mail', 'sm')}${L('ابعت تذكير للكل', 'Send reminder to all')}</button></div>
      </div>
    </section>
    <section class="card table-wrap">
      <div class="tabs" style="padding-inline:var(--gl-space-6)" data-tabs="bt"><span class="tab active" data-tab="inv">${L('الفواتير', 'Invoices')} <span class="badge">1,284</span></span><span class="tab" data-tab="subs">${L('الاشتراكات', 'Subscriptions')} <span class="badge">130</span></span><span class="tab" data-tab="failed">${L('مدفوعات فاشلة', 'Failed payments')} <span class="badge">3</span></span><span class="tab" data-tab="ref">${L('المستردات', 'Refunds')} <span class="badge">2</span></span></div>
      <div data-pane-group="bt" data-pane="inv">
      <div class="toolbar"><label class="control search sm">${icon('search', 'sm')}<input data-search="invTbl" placeholder="${L('رقم الفاتورة أو اسم الشركة…', 'Invoice # or company…')}"></label>
        <span class="sel sm">${ui.select('s', [['paid', L('مدفوعة', 'Paid')], ['open', L('مستحقة', 'Open')], ['over', L('متأخرة', 'Overdue')], ['ref', L('مستردة', 'Refunded')]], { ph: L('كل الحالات', 'All statuses'), filter: 'invTbl', key: 'st', cls: 'sm', icon: 'circle-dot' })}</span>
        <span class="sel sm">${ui.select('p', ['Starter', 'Growth', 'Enterprise'], { ph: L('كل الخطط', 'All plans'), filter: 'invTbl', key: 'plan', cls: 'sm', icon: 'layers' })}</span>

        <thead><tr><th>${L('رقم الفاتورة', 'Invoice')}</th><th>${L('الشركة', 'Company')}</th><th>${L('الخطة', 'Plan')}</th><th>${L('المبلغ', 'Amount')}</th><th>${L('الإصدار', 'Issued')}</th><th>${L('الاستحقاق', 'Due')}</th><th>${L('الحالة', 'Status')}</th><th></th></tr></thead>
        <tbody>${inv.map(r => `<tr data-row data-st="${r[9]}" data-plan="${r[5]}" data-ctx='${JSON.stringify({ co: r[1], amt: r[6], plan: r[5], iss: r[7], due: r[8] })}'><td><a class="ltr t-strong link" href="#" data-open="invoice" data-f="name">${r[0]}</a></td>
          <td><div class="cell-co">${ui.av(r[4], r[3], 'sm')}<div><div class="nm">${r[1]}</div><div class="dm">${r[2]}</div></div></div></td>

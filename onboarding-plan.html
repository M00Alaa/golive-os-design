<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.wiz-main{max-width:1080px}
.bill{display:flex;justify-content:center}
.trust{display:flex;justify-content:center;gap:var(--gl-space-8);flex-wrap:wrap;font:var(--gl-type-body-sm);color:var(--gl-text-secondary)}
.trust span{display:inline-flex;align-items:center;gap:var(--gl-space-2)}
.trust svg.i{color:var(--gl-success-fg);width:16px;height:16px}
.plan .old{font:var(--gl-type-body);color:var(--gl-text-muted);text-decoration:line-through;direction:ltr}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
GL.mount({
  shell: 'wizard', step: 2,
  title: L => L('اختيار الخطة', 'Choose a plan'),
  modals: {
    sales: { icon: 'calendar', title: L => L('كلم فريق المبيعات', 'Talk to sales'), sub: L => L('هنرجعلك خلال يوم عمل', 'We’ll reply within 1 business day'),
      body: (L, { ui }) => `<div class="form-grid">${ui.field(L('الاسم', 'Name'), ui.input('n', { req: 1, val: L('أحمد سامي', 'Ahmed Samy') }), { req: 1 })}${ui.field(L('الإيميل', 'Email'), ui.input('e', { req: 1, type: 'email', ltr: 1, val: 'ahmed@nilesoft.example' }), { req: 1 })}${ui.field(L('عدد المستخدمين', 'Users'), ui.select('u', ['30–50', '50–100', '100+'], { val: '50–100' }))}${ui.field(L('محتاجين', 'Need'), ui.select('nd', ['SSO / SAML', L('استضافة مخصصة', 'Dedicated hosting'), L('الاتنين', 'Both')]))}</div>${ui.field(L('رسالة', 'Message'), ui.textarea('m', { rows: 3 }), { opt: L('اختياري', 'optional') })}`,
      submit: L => L('إرسال', 'Send'), submitIcon: 'send', toast: L => [L('وصلنا طلبك', 'Request received'), L('فريق المبيعات هيكلمك', 'Our sales team will contact you')] }
  },
  render: (L, { icon }) => {
    const per = `<span class="t-sm muted">${L('/ شهريًا للشركة', '/ mo per company')}</span>`;
    const plan = (n, price, old, d, f, cta, pop) => `<article class="card plan ${pop ? 'pop' : ''}">${pop ? `<span class="tag ribbon" style="background:var(--gl-accent-default);color:var(--gl-brand-950)">${icon('star', 'xs')}${L('الأنسب لحجم فريقك', 'Best for your team size')}</span>` : ''}
      <div><h3 class="t-h2">${n}</h3><p class="t-sm sec mt-1">${d}</p></div>
      <div class="price">${price}${old ? `<span class="old" data-pane-group="cyc" data-pane="y">${old}</span>` : ''}</div>
      <ul>${f.map(x => `<li class="${x[1] ? '' : 'off'}">${icon(x[1] ? 'check' : 'minus')}<span>${x[0]}</span></li>`).join('')}</ul>
      ${cta}</article>`;
    return `
    <div class="wiz-head"><span class="t-over" style="color:var(--gl-brand-text)">${L('خطوة 3 من 4', 'Step 3 of 4')}</span><h1>${L('اختار خطتك', 'Choose your plan')}</h1><p>${L('كل الخطط بتبدأ بتجربة مجانية 14 يوم. مش هندفعك حاجة دلوقتي.', 'Every plan starts with a 14-day free trial. You won’t be charged today.')}</p></div>
    <div class="bill"><div class="pills" data-tabs="cyc"><span class="pill" data-tab="m">${L('شهري', 'Monthly')}</span><span class="pill active" data-tab="y">${L('سنوي', 'Annual')} <span class="tag success" style="height:20px">${L('وفّر 20%', 'Save 20%')}</span></span></div></div>
    <section class="plans">
      ${plan('Starter', `<b><span data-pane-group="cyc" data-pane="y">$63</span><span data-pane-group="cyc" data-pane="m" hidden>$79</span></b>${per}`, '$79', L('للفرق الصغيرة وأول المشاريع', 'For small teams and first projects'), [[L('حتى 8 مستخدمين', 'Up to 8 users'), 1], [L('3 مشاريع نشطة', '3 active projects'), 1], [L('بوابة العميل والموافقات', 'Client portal & sign-offs'), 1], [L('قوالب جاهزة', 'Ready-made playbooks'), 1], [L('هوية البوابة الخاصة', 'Custom portal branding'), 0], [L('تقارير الربحية', 'Profitability reports'), 0]], `<a class="btn btn-outline" href="ws-welcome.html">${L('ابدأ بـ Starter', 'Start with Starter')}</a>`)}
      ${plan('Growth', `<b><span data-pane-group="cyc" data-pane="y">$143</span><span data-pane-group="cyc" data-pane="m" hidden>$179</span></b>${per}`, '$179', L('لشركات التنفيذ اللي بتكبر', 'For growing implementation firms'), [[L('حتى 30 مستخدم', 'Up to 30 users'), 1], [L('10 مشاريع نشطة', '10 active projects'), 1], [L('بوابة بهوية شركتك ودومين خاص', 'Branded portal & custom domain'), 1], [L('تقارير الربحية والضغط', 'Profitability & workload reports'), 1], [L('API وWebhooks', 'API & webhooks'), 1], ['SSO / SAML', 0]], `<a class="btn btn-primary" href="ws-welcome.html">${L('ابدأ التجربة على Growth', 'Start trial on Growth')}${icon('arrow-right', 'sm flip')}</a>`, 1)}
      ${plan('Enterprise', `<b>${L('مخصص', 'Custom')}</b>`, '', L('للشركات الكبيرة ومتطلبات الأمان', 'For larger firms and security needs'), [[L('مستخدمين ومشاريع بلا حدود', 'Unlimited users & projects'), 1], ['SSO / SAML', 1], [L('مدير نجاح مخصص', 'Dedicated success manager'), 1], [L('اتفاقية SLA ونسخ احتياطي مخصص', 'Uptime SLA & custom backups'), 1], [L('استضافة في منطقة مخصصة', 'Dedicated data region'), 1], [L('تدريب لفريقك', 'Team onboarding sessions'), 1]], `<button type="button" class="btn btn-outline" data-open="sales">${icon('calendar', 'sm')}${L('احجز مكالمة', 'Talk to sales')}</button>`)}
    </section>
    <div class="trust"><span>${icon('check-circle')}${L('من غير كارت دلوقتي', 'No card today')}</span><span>${icon('check-circle')}${L('غيّر أو ألغي في أي وقت', 'Change or cancel any time')}</span><span>${icon('check-circle')}${L('فواتير بالجنيه أو الدولار', 'Invoices in EGP or USD')}</span></div>
    <div class="row between"><a class="btn btn-ghost" href="onboarding-invite.html">${icon('arrow-left', 'sm flip')}${L('رجوع', 'Back')}</a><span class="t-cap muted">${L('الأسعار بالدولار وبدون ضريبة القيمة المضافة', 'Prices in USD, excluding VAT')}</span></div>`;
  }
});
</script>
</body>
</html>

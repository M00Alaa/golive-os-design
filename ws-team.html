<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.util{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:var(--gl-space-3)}
.util .p{font:var(--gl-type-label-sm);text-align:end;font-variant-numeric:tabular-nums}
.role{display:flex;gap:var(--gl-space-3);padding-block:var(--gl-space-3)}
.role + .role{border-block-start:1px solid var(--gl-border-default)}
.role .t{font:var(--gl-type-body-strong);display:flex;align-items:center;gap:var(--gl-space-2)}
.role .d{font:var(--gl-type-caption);color:var(--gl-text-muted);margin-top:2px}
.seats{display:flex;align-items:baseline;gap:6px}
.seats b{font:var(--gl-type-kpi)}
.skills{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.skills .tag{height:22px}

.toolbar .sel{width:184px}.toolbar .sel .control{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
const tmR = L => ({ owner: ['accent', L('مالك', 'Owner')], admin: ['violet', L('مسؤول', 'Admin')], pm: ['brand', L('مدير مشروع', 'Project manager')], consultant: ['info', L('استشاري', 'Consultant')], viewer: ['neutral', L('مشاهد', 'Viewer')] });
const invRow = (L, e, role, sent) => `<tr data-row><td><div class="cell-co"><span class="avatar sm round" style="background:var(--gl-bg-subtle);color:var(--gl-text-muted)">${GL.icon('mail', 'xs')}</span><div class="nm ltr" style="text-align:start" data-f="name">${e}</div></div></td><td>${GL.ui.tag(tmR(L)[role][0], tmR(L)[role][1], false)}</td><td class="sec">${sent}</td><td class="right"><div class="row gap-2" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-toast="success|${L('اتبعتت الدعوة تاني', 'Invite resent')}|${e}">${GL.icon('refresh', 'sm')}${L('إعادة', 'Resend')}</button><button class="btn btn-ghost btn-sm" style="color:var(--gl-danger-fg)" data-delete="${e}">${L('إلغاء', 'Revoke')}</button></div></td></tr>`;
GL.mount({
  shell: 'ws', nav: 'ws-team',
  modals: {
    invite: { icon: 'user-plus', title: L => L('دعوة أعضاء', 'Invite members'), sub: L => L('20 مقعد متاح في خطة Growth', '20 seats left on Growth'),
      body: (L, { ui }) => `${ui.field(L('البريد', 'Email'), ui.input('email', { req: 1, type: 'email', ltr: 1, icon: 'mail', ph: 'name@nilesoft.example' }), { req: 1, hint: L('لدعوة أكتر من شخص، ابعت الدعوة وكرر', 'To invite several people, send and repeat') })}
        ${ui.field(L('الدور', 'Role'), ui.select('role', [['consultant', L('استشاري', 'Consultant')], ['pm', L('مدير مشروع', 'Project manager')], ['admin', L('مسؤول', 'Admin')], ['viewer', L('مشاهد', 'Viewer')]], { icon: 'shield' }))}
        <div class="field"><label>${L('المشاريع', 'Projects')} <span class="t-cap muted">(${L('اختياري', 'optional')})</span></label><div class="row gap-2 wrap" data-multi>${GL_PROJECTS.slice(0, 5).map((p, i) => `<span class="opt ${i === 0 ? 'on' : ''}" style="padding:6px 12px"><span class="box ${i === 0 ? 'on' : ''}">${i === 0 ? GL.icon('check') : ''}</span>${GL.L(p[0], p[1])}</span>`).join('')}</div></div>
        ${ui.field(L('رسالة', 'Personal note'), ui.textarea('note', { rows: 3, ph: L('أهلًا بيك في فريق نيل سوفت!', 'Welcome to the NileSoft team!') }), { opt: L('اختياري', 'optional') })}`,
      submit: L => L('إرسال الدعوة', 'Send invite'), submitIcon: 'send',
      onSubmit: v => { GLI.UI.tm = 'pending'; document.querySelector('[data-tabs=tm] [data-tab=pending]').click(); },
      add: { table: 'invTbl', row: (v, L) => invRow(L, v.email, v.role, L('الآن', 'Just now')) }, toast: (L, v) => [L('اتبعتت الدعوة', 'Invite sent'), v.email] },
    role: { size: 'sm', icon: 'user-cog', title: L => L('تغيير الدور', 'Change role'), sub: (L, c) => c.name, body: (L, { ui }) => ui.field(L('الدور', 'Role'), ui.select('role', [['admin', L('مسؤول', 'Admin')], ['pm', L('مدير مشروع', 'Project manager')], ['consultant', L('استشاري', 'Consultant')], ['viewer', L('مشاهد', 'Viewer')]])),
      onSubmit: (v, { row }) => { const R = tmR(GL.L); if (row) { row.querySelector('[data-rl]').innerHTML = GL.ui.tag(R[v.role][0], R[v.role][1], false); row.dataset.role = v.role; GLI.flash(row); } }, toast: L => [L('اتغير الدور', 'Role changed'), ''] },
    assign: { size: 'sm', icon: 'briefcase', title: L => L('إضافة لمشروع', 'Add to project'), sub: (L, c) => c.name, body: (L, { ui }) => `${ui.field(L('المشروع', 'Project'), ui.select('p', GL_PROJECTS.map(p => GL.L(p[0], p[1])), { ph: L('اختار مشروع', 'Choose a project'), req: 1 }), { req: 1 })}${ui.field(L('نسبة التخصيص', 'Allocation'), ui.select('a', ['25%', '50%', '75%', '100%'], { val: '50%' }))}`, submit: L => L('إضافة', 'Add'), toast: (L, v) => [L('اتضاف للمشروع', 'Added to project'), v.p] },
    guest: { icon: 'user-plus', title: L => L('دعوة ضيف', 'Invite a guest'), sub: L => L('مستشار خارجي بيشوف مشروع واحد بس، ومش بيتحسب مقعد', 'An outside consultant who sees one project only — no seat used'),
      body: (L, { ui }) => `<div class="form-grid">${ui.field(L('الاسم', 'Name'), ui.input('name', { req: 1 }), { req: 1 })}${ui.field(L('البريد', 'Email'), ui.input('email', { req: 1, type: 'email', ltr: 1 }), { req: 1 })}${ui.field(L('المشروع', 'Project'), ui.select('p', GL_PROJECTS.map(p => GL.L(p[0], p[1]))), { full: 1 })}${ui.field(L('ينتهي الوصول', 'Access expires'), ui.input('exp', { type: 'date', ltr: 1 }), { full: 1 })}</div>`,
      submit: L => L('دعوة', 'Invite guest'), add: { table: 'gTbl', row: (v, L) => `<tr data-row><td><div class="cell-co">${GL.ui.av(v.name.trim()[0], 'av-amber', 'round')}<div><div class="nm" data-f="name">${v.name}</div><div class="dm">${v.email}</div></div></div></td><td>${v.p}</td><td class="sec">${v.exp || '—'}</td><td class="right"><button class="btn btn-ghost btn-sm" style="color:var(--gl-danger-fg)" data-delete="${v.name}">${L('إزالة', 'Remove')}</button></td></tr>` }, toast: L => [L('اتبعتت دعوة الضيف', 'Guest invited'), ''] }
  },
  menus: { tm: [{ icon: 'user-cog', ar: 'تغيير الدور', en: 'Change role', open: 'role' }, { icon: 'briefcase', ar: 'إضافة لمشروع', en: 'Add to project', open: 'assign' }, { icon: 'key-round', ar: 'إعادة ضبط كلمة المرور', en: 'Send password reset', toast: (L, n) => `success|${L('اتبعت اللينك', 'Reset link sent')}|${n}` }, '-', { icon: 'user-x', ar: 'إيقاف', en: 'Deactivate', confirm: 'deact' }, { icon: 'trash-2', ar: 'إزالة من المساحة', en: 'Remove from workspace', del: 1, danger: 1 }] },
  confirms: { deact: { danger: 1, icon: 'user-x', title: (L, c) => L(`إيقاف ${c.name}؟`, `Deactivate ${c.name}?`), text: L => L('مهامه المفتوحة هتفضل زي ما هي، ومقعده هيتحرر.', 'Open tasks stay as they are and the seat is freed.'), btn: L => L('إيقاف', 'Deactivate'), run: (L, c, row) => { row.style.opacity = .55; }, toast: (L, c) => [L('اتوقف العضو', 'Member deactivated'), c.name] } },
  title: L => L('الفريق والصلاحيات', 'Team & roles'),
  render: (L, { icon, ui }) => {
    const T = GL_TEAM;
    const R0 = { owner: ['accent', L('مالك', 'Owner')], admin: ['violet', L('مسؤول', 'Admin')], pm: ['brand', L('مدير مشروع', 'Project manager')], consultant: ['info', L('استشاري', 'Consultant')], viewer: ['neutral', L('مشاهد', 'Viewer')] }; const R = tmR(L);
    const rows = [
      ['as', 'ahmed@nilesoft.example', 'owner', 7, 40, ['Odoo', L('مبيعات', 'Sales')]],
      ['ma', 'mona@nilesoft.example', 'pm', 2, 92, ['Odoo', 'PMP']],
      ['ok', 'omar@nilesoft.example', 'pm', 2, 78, ['Odoo', L('مخازن', 'Inventory')]],
      ['rf', 'rana@nilesoft.example', 'pm', 2, 85, ['CRM', 'POS']],
      ['me', 'mahmoud@nilesoft.example', 'consultant', 3, 64, ['MRP', L('محاسبة', 'Accounting')]],
      ['yt', 'yasmin@nilesoft.example', 'consultant', 3, 104, ['Python', 'API']],
      ['ha', 'hossam@nilesoft.example', 'consultant', 2, 71, ['SQL', L('ترحيل', 'Migration')]],
      ['dm', 'dina@nilesoft.example', 'admin', 1, 48, [L('تدريب', 'Training'), 'HR']]
    ];
    return `
    <div class="page-head">
      <div><h1 class="t-h1">${L('الفريق والصلاحيات', 'Team & roles')}</h1><p class="sub">${L('أعضاء شركتك، أدوارهم وحجم الشغل على كل واحد', 'Your company’s members, their roles and workload')}</p></div>
      <div class="actions"><button class="btn btn-outline" data-open="guest">${icon('user-plus', 'sm')}${L('دعوة ضيف', 'Invite guest')}</button><button class="btn btn-primary" data-open="invite">${icon('user-plus', 'sm')}${L('دعوة عضو', 'Invite member')}</button></div>
    </div>
    <section class="grid g-12" style="align-items:start">
      <div class="span-8 card table-wrap">
        <div class="tabs" style="padding-inline:var(--gl-space-6)" data-tabs="tm"><span class="tab active" data-tab="members">${L('الأعضاء', 'Members')} <span class="badge">8</span></span><span class="tab" data-tab="pending">${L('دعوات معلقة', 'Pending invites')} <span class="badge">2</span></span><span class="tab" data-tab="guests">${L('الضيوف', 'Guests')} <span class="badge">1</span></span></div>
        <div data-pane-group="tm" data-pane="members">
        <div class="toolbar"><label class="control search sm">${icon('search', 'sm')}<input data-search="tmTbl" placeholder="${L('ابحث بالاسم أو المهارة…', 'Search by name or skill…')}"></label><span class="sel sm">${ui.select('r', Object.entries(R).map(([k, r]) => [k, r[1]]), { ph: L('كل الأدوار', 'All roles'), filter: 'tmTbl', key: 'role', cls: 'sm', icon: 'shield' })}</span></div>
        <table class="tbl" id="tmTbl">
          <colgroup><col><col style="width:152px"><col style="width:88px"><col style="width:144px"><col style="width:56px"></colgroup>
          <thead><tr><th>${L('العضو', 'Member')}</th><th>${L('الدور', 'Role')}</th><th>${L('المشاريع', 'Projects')}</th><th>${L('الضغط الأسبوع ده', 'Load this week')}</th><th></th></tr></thead>
          <tbody>${rows.map(r => `<tr data-row data-role="${r[2]}">
            <td><div class="cell-co">${ui.av(L(T[r[0]][2], T[r[0]][3]), T[r[0]][4], 'round')}<div><div class="nm" data-f="name">${L(T[r[0]][0], T[r[0]][1])}</div><div class="dm">${r[1]}</div></div></div></td>
            <td data-rl>${ui.tag(R[r[2]][0], R[r[2]][1], false)}</td><td><span class="t-strong">${r[3]}</span></td>
            <td><div class="util"><div class="bar thin ${r[4] > 100 ? 'danger' : r[4] > 90 ? 'warn' : ''}"><i style="width:${Math.min(r[4], 100)}%"></i></div><span class="p" style="${r[4] > 100 ? 'color:var(--gl-danger-fg)' : ''}">${r[4]}%</span></div></td>
            <td class="right">${r[2] === 'owner' ? '' : ui.menuBtn('tm')}</td></tr>`).join('')}</tbody>
        </table></div>
        <div data-pane-group="tm" data-pane="pending" hidden><table class="tbl" id="invTbl"><colgroup><col><col style="width:160px"><col style="width:112px"><col style="width:176px"></colgroup><thead><tr><th>${L('البريد', 'Email')}</th><th>${L('الدور', 'Role')}</th><th>${L('اتبعتت', 'Sent')}</th><th></th></tr></thead><tbody>${invRow(L, 'karim@nilesoft.example', 'consultant', L('منذ يومين', '2 days ago'))}${invRow(L, 'salma@nilesoft.example', 'pm', L('منذ 5 أيام', '5 days ago'))}</tbody></table></div>
        <div data-pane-group="tm" data-pane="guests" hidden><table class="tbl" id="gTbl"><colgroup><col><col style="width:200px"><col style="width:136px"><col style="width:112px"></colgroup><thead><tr><th>${L('الضيف', 'Guest')}</th><th>${L('المشروع', 'Project')}</th><th>${L('ينتهي', 'Expires')}</th><th></th></tr></thead><tbody><tr data-row><td><div class="cell-co">${ui.av(L('ف', 'FS'), 'av-amber', 'round')}<div><div class="nm" data-f="name">${L('فادي سمير', 'Fady Samir')}</div><div class="dm">fady@freelance.example</div></div></div></td><td>${L('تخطيط التصنيع MRP', 'Manufacturing MRP')}</td><td class="sec">${L('31 ديسمبر', 'Dec 31')}</td><td class="right"><button class="btn btn-ghost btn-sm" style="color:var(--gl-danger-fg)" data-delete="${L('فادي سمير', 'Fady Samir')}">${L('إزالة', 'Remove')}</button></td></tr></tbody></table></div>
      </div>
      <aside class="span-4 side">
        <div class="card"><div class="card-head"><div><h3 class="t-h3">${L('المقاعد', 'Seats')}</h3><p class="sub">${L('خطة Growth', 'Growth plan')}</p></div><a class="btn btn-outline btn-sm" href="ws-settings.html">${L('ترقية', 'Upgrade')}</a></div>
          <div class="card-body pt0"><div class="seats"><b>10</b><span class="muted">/ 30 ${L('مستخدم', 'users')}</span></div><div class="bar mt-3"><i style="width:33%"></i></div><p class="t-cap muted mt-2">${L('8 أعضاء + 2 دعوات معلقة · جهات اتصال العملاء مجانية', '8 members + 2 pending · client contacts are free')}</p></div></div>
        <div class="card"><div class="card-head"><div><h3 class="t-h3">${L('الأدوار', 'Roles')}</h3><p class="sub">${L('صلاحيات كل دور داخل المساحة', 'What each role can do in the workspace')}</p></div></div>
          <div class="card-body pt0">${[['crown', 'owner', L('كل حاجة، بما فيها الفوترة وحذف المساحة', 'Everything, including billing and deleting the workspace')], ['shield', 'admin', L('إدارة الأعضاء والقوالب والإعدادات', 'Manage members, playbooks and settings')], ['briefcase', 'pm', L('إنشاء مشاريع، دعوة العملاء وإرسال الموافقات', 'Create projects, invite clients, send sign-offs')], ['user-cog', 'consultant', L('تنفيذ المهام والمتطلبات في مشاريعه', 'Work on tasks and requirements in assigned projects')], ['eye', 'viewer', L('عرض فقط، مناسب للإدارة العليا', 'Read-only, ideal for leadership')]].map(r => `
            <div class="role"><span class="ic-tile" style="width:36px;height:36px">${icon(r[0], 'sm')}</span><div><div class="t">${R[r[1]][1]}</div><div class="d">${r[2]}</div></div></div>`).join('')}</div></div>
      </aside>
    </section>`;
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.ws-pick{display:flex;align-items:center;gap:var(--gl-space-3);padding:var(--gl-space-3);border:1px solid var(--gl-border-default);border-radius:var(--gl-radius-md)}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/interact.js"></script>
<script>
GL.mount({
  shell: 'auth',
  title: L => L('تسجيل الدخول', 'Log in'),
  modals: {
    forgot: { size: 'sm', icon: 'key-round', title: L => L('نسيت كلمة السر؟', 'Forgot your password?'), sub: L => L('هنبعتلك لينك صالح لمدة ساعة', 'We’ll email a link valid for 1 hour'), body: (L, { ui }) => ui.field(L('الإيميل', 'Email'), ui.input('email', { req: 1, type: 'email', ltr: 1, icon: 'mail', val: 'ahmed@nilesoft.example' }), { req: 1 }), submit: L => L('ابعت اللينك', 'Send link'), toast: (L, v) => [L('اتبعت اللينك', 'Reset link sent'), v.email] },
    sso: { size: 'sm', icon: 'key-round', title: L => L('الدخول بـ SSO', 'Sign in with SSO'), body: (L, { ui }) => ui.field(L('دومين شركتك', 'Company domain'), ui.input('d', { req: 1, ltr: 1, icon: 'globe', ph: 'nilesoft.example' }), { req: 1, hint: L('هنحولك لمزود الهوية بتاع شركتك', 'We’ll redirect you to your identity provider') }), submit: L => L('متابعة', 'Continue'), toast: (L, v) => [L('بنحولك لـ Microsoft Entra', 'Redirecting to Microsoft Entra'), v.d, 'info'] }
  },
  render: (L, { icon, ui }) => {
    const G = `<svg class="g-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9Z"/></svg>`;
    return `
    <div class="stack gap-6" data-form>
      <div><h1 class="auth-h">${L('أهلًا بيك تاني 👋', 'Welcome back 👋')}</h1><p class="sec mt-1">${L('سجّل دخول لمساحة عمل شركتك أو لبوابة العميل.', 'Log in to your company workspace or client portal.')}</p></div>
      <button type="button" class="btn btn-outline block" data-toast="info|${L('بنحولك لـ Google', 'Redirecting to Google')}|">${G}${L('الدخول بـ Google', 'Continue with Google')}</button>
      <div class="or">${L('أو', 'or')}</div>
      <div class="stack gap-4">
        ${ui.field(L('الإيميل', 'Email'), ui.input('email', { req: 1, type: 'email', ltr: 1, icon: 'mail', val: 'ahmed@nilesoft.example' }))}
        <div class="field"><div class="row between"><label>${L('كلمة السر', 'Password')}</label><a class="link t-cap" href="#" data-open="forgot">${L('نسيت كلمة السر؟', 'Forgot password?')}</a></div><span class="control">${icon('lock', 'sm')}<input name="pw" type="password" data-req placeholder="••••••••"><button type="button" class="icon-btn sm" data-eye style="margin-inline-end:-8px">${icon('eye')}</button></span></div>
      </div>
      <label class="check t-sm"><span class="box on">${icon('check')}</span>${L('افتكرني على الجهاز ده', 'Remember me on this device')}</label>
      <a class="btn btn-primary block" href="#" data-step="ws-dashboard.html">${L('تسجيل الدخول', 'Log in')}</a>
      <div class="ws-pick"><span class="ic-tile" style="width:36px;height:36px">${icon('key-round', 'sm')}</span><div class="grow"><div class="t-strong t-sm">${L('شركتك بتستخدم SSO؟', 'Company uses SSO?')}</div><div class="t-cap muted">${L('ادخل بحساب Microsoft Entra أو Okta', 'Sign in with Microsoft Entra or Okta')}</div></div><button type="button" class="btn btn-ghost btn-sm" data-open="sso">SSO${icon('chevron-right', 'sm flip')}</button></div>
      <p class="t-sm sec" style="text-align:center">${L('جديد على GoLive؟', 'New to GoLive?')} <a class="link" href="signup.html">${L('ابدأ تجربة مجانية', 'Start a free trial')}</a></p>
    </div>`;
  }
});
</script>
</body>
</html>

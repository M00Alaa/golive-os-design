<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.ws-pick{display:flex;align-items:center;gap:var(--gl-space-3);padding:var(--gl-space-3);border:1px solid var(--gl-border-default);border-radius:var(--gl-radius-md)}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
GL.mount({
  shell: 'auth',
  title: L => L('تسجيل الدخول', 'Log in'),
  render: (L, { icon }) => {
    const G = `<svg class="g-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.7Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9Z"/></svg>`;
    return `
    <div class="stack gap-6">
      <div><h1 class="auth-h">${L('أهلًا بيك تاني 👋', 'Welcome back 👋')}</h1><p class="sec mt-1">${L('سجّل دخول لمساحة عمل شركتك أو لبوابة العميل.', 'Log in to your company workspace or client portal.')}</p></div>
      <button class="btn btn-outline block">${G}${L('الدخول بـ Google', 'Continue with Google')}</button>
      <div class="or">${L('أو', 'or')}</div>
      <div class="stack gap-4">
        <div class="field"><label>${L('الإيميل', 'Email')}</label><span class="control">${icon('mail', 'sm')}<input class="ltr" value="ahmed@nilesoft.example"></span></div>
        <div class="field"><div class="row between"><label>${L('كلمة السر', 'Password')}</label><a class="link t-cap" href="#">${L('نسيت كلمة السر؟', 'Forgot password?')}</a></div><span class="control is-error">${icon('lock', 'sm')}<input type="password" value="wrongpass"><button class="icon-btn sm" style="margin-inline-end:-8px">${icon('eye-off')}</button></span><span class="err row gap-1">${icon('alert-circle', 'xs')}${L('الإيميل أو كلمة السر غلط. فاضل محاولتين قبل قفل الحساب 15 دقيقة.', 'Incorrect email or password. 2 attempts left before a 15-minute lock.')}</span></div>
      </div>
      <label class="check t-sm"><span class="box on">${icon('check')}</span>${L('افتكرني على الجهاز ده', 'Remember me on this device')}</label>
      <a class="btn btn-primary block" href="ws-dashboard.html">${L('تسجيل الدخول', 'Log in')}</a>
      <div class="ws-pick"><span class="ic-tile" style="width:36px;height:36px">${icon('key-round', 'sm')}</span><div class="grow"><div class="t-strong t-sm">${L('شركتك بتستخدم SSO؟', 'Company uses SSO?')}</div><div class="t-cap muted">${L('ادخل بحساب Microsoft Entra أو Okta', 'Sign in with Microsoft Entra or Okta')}</div></div><button class="btn btn-ghost btn-sm">SSO${icon('chevron-right', 'sm flip')}</button></div>
      <p class="t-sm sec" style="text-align:center">${L('جديد على GoLive؟', 'New to GoLive?')} <a class="link" href="signup.html">${L('ابدأ تجربة مجانية', 'Start a free trial')}</a></p>
    </div>`;
  }
});
</script>
</body>
</html>

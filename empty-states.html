<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.es-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gl-space-6)}
.es{display:flex;flex-direction:column}
.es .lbl{display:flex;align-items:center;justify-content:space-between;padding:var(--gl-space-3) var(--gl-space-5);border-block-end:1px solid var(--gl-border-default);font:var(--gl-type-label-sm);color:var(--gl-text-muted)}
.es .empty{flex:1;justify-content:center;min-height:300px}
.es .empty-ic.warn{background:var(--gl-warning-bg);color:var(--gl-warning-fg)}
.es .empty-ic.ok{background:var(--gl-success-bg);color:var(--gl-success-fg)}
.es .empty-ic.info{background:var(--gl-info-bg);color:var(--gl-info-fg)}
.es .empty-ic.danger{background:var(--gl-danger-bg);color:var(--gl-danger-fg)}
.es .empty-ic.muted{background:var(--gl-bg-subtle);color:var(--gl-text-muted)}
.illus{position:relative;width:124px;height:72px;margin-bottom:var(--gl-space-2)}
.illus i{position:absolute;display:block;border-radius:8px;border:1px solid var(--gl-border-default);background:var(--gl-bg-surface);box-shadow:var(--gl-shadow-sm)}
.illus i:nth-child(1){inset:8px 24px 16px 0;transform:rotate(-6deg)}
.illus i:nth-child(2){inset:0 0 24px 28px;transform:rotate(5deg)}
.illus span{position:absolute;inset-inline-start:44px;top:16px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gl-brand-primary);color:var(--gl-text-on-brand);box-shadow:var(--gl-shadow-md)}
.illus span svg.i{width:20px;height:20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
GL.mount({
  doc: 'empty',
  title: L => L('الحالات الفاضية', 'Empty states'),
  render: (L, { icon }) => {
    const es = (surface, ic, cls, title, text, actions, illus) => `<div class="card es"><div class="lbl"><span>${surface}</span>${icon('inbox', 'xs')}</div><div class="empty">
      ${illus ? `<div class="illus"><i></i><i></i><span>${icon(ic)}</span></div>` : `<span class="empty-ic ${cls}">${icon(ic)}</span>`}
      <h3 class="t-h3">${title}</h3><p>${text}</p>${actions ? `<div class="row gap-2 mt-1">${actions}</div>` : ''}</div></div>`;
    const P = (t, ic, href) => `<a class="btn btn-primary btn-sm" href="${href || '#'}">${ic ? icon(ic) : ''}${t}</a>`;
    const O = (t, ic) => `<button class="btn btn-outline btn-sm">${ic ? icon(ic) : ''}${t}</button>`;
    return `
    <section class="ds-sec"><header><div class="t-over">${L('التسجيل والإعداد', 'Onboarding')}</div><h2>${L('الحالات الفاضية', 'Empty states')}</h2><p>${L('كل قائمة في المنتج ليها حالة فاضية بتشرح الفايدة وبتدي خطوة واضحة واحدة. نفس الشكل في الوضع الفاتح والغامق وفي العربي والإنجليزي.', 'Every list in the product has an empty state that explains the value and offers one clear next step. Same pattern in light/dark and Arabic/English.')}</p></header>
      <div class="es-grid">
        ${es('Workspace · ' + L('المشاريع', 'Projects'), 'briefcase', '', L('ابدأ أول مشروع تنفيذ', 'Start your first implementation'), L('اختار قالب جاهز والمراحل والمهام والمتطلبات هتتعمل لوحدها.', 'Pick a playbook and phases, tasks and requirements are created for you.'), P(L('مشروع جديد', 'New project'), 'plus', 'ws-projects.html') + O(L('القوالب', 'Playbooks')), 1)}
        ${es('Workspace · ' + L('العملاء', 'Clients'), 'building-2', '', L('لسه مفيش عملاء', 'No clients yet'), L('أضف عميل ودعوة جهات الاتصال لبوابة بهوية شركتك.', 'Add a client and invite their contacts to your branded portal.'), P(L('عميل جديد', 'New client'), 'plus') + O(L('استيراد CSV', 'Import CSV'), 'download'))}
        ${es('Workspace · ' + L('الـ Blockers', 'Blockers'), 'check-circle', 'ok', L('مفيش Blockers 🎉', 'No blockers 🎉'), L('كل المشاريع ماشية من غير عوائق. أي blocker جديد هيظهر هنا فورًا.', 'Every project is moving freely. New blockers will show up here instantly.'))}
        ${es(L('بوابة العميل · المطلوب منك', 'Client portal · Requests'), 'party-popper', 'ok', L('مفيش حاجة مطلوبة منك دلوقتي', 'Nothing needed from you right now'), L('هنبعتلك إيميل أول ما الفريق يحتاج حاجة. شكرًا إنك سريع 🙏', 'We’ll email you when the team needs something. Thanks for being quick 🙏'), O(L('شوف التقدم', 'View progress')))}
        ${es(L('بوابة العميل · الملفات', 'Client portal · Files'), 'folder', 'info', L('لسه مفيش ملفات مشتركة', 'No shared files yet'), L('الملفات اللي بتشاركها مع الفريق أو اللي بيشاركها معاك هتظهر هنا.', 'Files you and the team share will appear here.'), P(L('رفع ملف', 'Upload'), 'upload'))}
        ${es(L('بوابة العميل · الرسائل', 'Client portal · Messages'), 'message', '', L('ابدأ محادثة مع فريقك', 'Start a conversation'), L('كل محادثة مرتبطة بموضوع، فبتلاقي القرار بسهولة بعدين.', 'Each thread has a topic, so decisions are easy to find later.'), P(L('رسالة جديدة', 'New message'), 'plus'))}
        ${es('Super Admin · ' + L('الدعم', 'Support'), 'life-buoy', 'ok', L('مفيش تذاكر مفتوحة', 'Inbox zero'), L('كل التذاكر اتحلت. متوسط وقت الحل الأسبوع ده 3 ساعات.', 'All tickets resolved. Avg. resolution this week: 3 hours.'))}
        ${es(L('البحث', 'Search'), 'search', 'muted', L('مفيش نتايج لـ «أوربت»', 'No results for “orbitt”'), L('جرّب كلمة تانية، أو شيل الفلاتر.', 'Try a different spelling or clear filters.'), O(L('مسح الفلاتر', 'Clear filters'), 'x'))}
        ${es(L('خطأ في التحميل', 'Load error'), 'alert-triangle', 'danger', L('مقدرناش نحمّل البيانات', 'We couldn’t load this'), L('الاتصال قطع أو فيه مشكلة عندنا. بياناتك سليمة.', 'The connection dropped or we hit a snag. Your data is safe.'), P(L('حاول تاني', 'Try again'), 'refresh') + O(L('حالة النظام', 'Status page')))}
      </div>
    </section>`;
  }
});
</script>
</body>
</html>

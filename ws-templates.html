<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLive OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens.css">
<style>
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gl-space-4)}
.tpl{padding:var(--gl-space-5);display:flex;flex-direction:column;gap:var(--gl-space-4);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.tpl:hover{box-shadow:var(--gl-shadow-md)}
.tpl.on{border-color:var(--gl-brand-primary);box-shadow:0 0 0 1px var(--gl-brand-primary)}
.tpl .t{font:600 15px/22px var(--gl-font-sans)}
.tpl .d{font:var(--gl-type-body-sm);color:var(--gl-text-secondary);margin-top:2px}
.tpl .st{display:flex;gap:var(--gl-space-4);font:var(--gl-type-caption);color:var(--gl-text-muted);flex-wrap:wrap}
.tpl .st span{display:inline-flex;align-items:center;gap:4px}
.tpl .phs{display:flex;gap:3px}
.tpl .phs i{flex:1;height:4px;border-radius:2px;background:var(--gl-brand-200)}
[data-theme="dark"] .tpl .phs i{background:var(--gl-brand-800)}
.tpl .phs i:nth-child(odd){background:var(--gl-brand-primary)}
.ph-acc{border:1px solid var(--gl-border-default);border-radius:var(--gl-radius-md);overflow:hidden}
.ph-acc + .ph-acc{margin-top:var(--gl-space-2)}
.ph-h{display:flex;align-items:center;gap:var(--gl-space-3);padding:var(--gl-space-3) var(--gl-space-4);background:var(--gl-bg-subtle)}
.ph-h .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:var(--gl-type-label-sm);background:var(--gl-brand-primary);color:var(--gl-text-on-brand);flex:none}
.ph-h .t{font:var(--gl-type-label);flex:1}
.ph-h .c{font:var(--gl-type-caption);color:var(--gl-text-muted)}
.ph-b{padding:var(--gl-space-2) var(--gl-space-4) var(--gl-space-3)}
.ti{display:flex;align-items:center;gap:var(--gl-space-2);padding-block:6px;font:var(--gl-type-body-sm)}
.ti svg.i{width:15px;height:15px;color:var(--gl-text-muted)}
.ti .tag{margin-inline-start:auto;height:20px}
.sticky{position:sticky;top:calc(var(--gl-topbar-h) + var(--gl-space-6))}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/icons.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
GL.mount({
  shell: 'ws', nav: 'ws-templates',
  title: L => L('قوالب التنفيذ', 'Playbooks'),
  render: (L, { icon, ui }) => {
    const TP = [
      ['layers', '', L('Odoo ERP قياسي', 'Odoo ERP standard'), L('محاسبة، مشتريات، مخازن ومبيعات لشركات التصنيع والتوزيع', 'Accounting, purchasing, inventory and sales for manufacturers & distributors'), 6, 84, 32, 12, L('16 أسبوع', '16 weeks'), 1],
      ['users', 'info', 'Odoo CRM ' + L('سريع', 'quick-start'), L('Pipeline، فرق المبيعات وتكامل الإيميل في 6 أسابيع', 'Pipeline, sales teams and email integration in 6 weeks'), 4, 38, 14, 9, L('6 أسابيع', '6 weeks')],
      ['database', 'warning', L('ترحيل البيانات', 'Data migration'), L('تنظيف ومطابقة وترحيل من الأنظمة القديمة على دفعات', 'Cleanse, map and migrate from legacy systems in batches'), 5, 46, 18, 7, L('8 أسابيع', '8 weeks')],
      ['credit-card', 'violet', L('نقاط البيع POS', 'Odoo POS rollout'), L('فروع متعددة، أجهزة، ودفع إلكتروني', 'Multi-branch, hardware and payment terminals'), 5, 52, 21, 4, L('10 أسابيع', '10 weeks')],
      ['settings', 'accent', L('تخطيط التصنيع MRP', 'Manufacturing MRP'), L('قوائم المواد، أوامر الشغل والجودة', 'Bills of materials, work orders and quality'), 6, 97, 40, 3, L('20 أسبوع', '20 weeks')],
      ['user-check', 'success', L('الموارد البشرية والرواتب', 'HR & payroll'), L('بيانات الموظفين، الحضور والرواتب حسب قانون العمل المصري', 'Employees, attendance and Egyptian-law payroll'), 4, 41, 16, 6, L('8 أسابيع', '8 weeks')]
    ];
    const phases = [
      [L('الاكتشاف', 'Discovery'), 12, 6, [[L('اجتماع البداية Kick-off', 'Kick-off workshop'), 'task'], [L('استبيان العمليات الحالية', 'Current-process questionnaire'), 'form'], [L('تحديد أصحاب القرار', 'Identify decision makers'), 'task']]],
      [L('التصميم (Blueprint)', 'Design (Blueprint)'), 18, 8, [[L('ورش عمل لكل قسم', 'Workshops per department'), 'task'], [L('وثيقة التصميم', 'Solution blueprint'), 'approval']]],
      [L('البناء والتهيئة', 'Build & configure'), 22, 5],
      [L('ترحيل البيانات', 'Data migration'), 14, 7],
      [L('اختبار القبول UAT', 'UAT'), 10, 4],
      [L('الإطلاق والدعم', 'Go-live & hypercare'), 8, 2]
    ];
    const kind = { task: ['neutral', L('مهمة', 'Task')], form: ['info', L('نموذج للعميل', 'Client form')], approval: ['accent', L('موافقة', 'Sign-off')] };
    return `
    <div class="page-head">
      <div><h1 class="t-h1">${L('قوالب التنفيذ', 'Implementation playbooks')}</h1><p class="sub">${L('مراحل ومهام ومتطلبات جاهزة، بتتنسخ لكل مشروع جديد', 'Reusable phases, tasks and client requirements, copied into every new project')}</p></div>
      <div class="actions"><button class="btn btn-outline">${icon('download', 'sm')}${L('استيراد من Excel', 'Import from Excel')}</button><button class="btn btn-primary">${icon('plus', 'sm')}${L('قالب جديد', 'New playbook')}</button></div>
    </div>
    <section class="grid g-12" style="align-items:start">
      <div class="span-7 stack gap-4">
        <div class="row gap-3"><label class="control search grow">${icon('search', 'sm')}<input placeholder="${L('ابحث في القوالب…', 'Search playbooks…')}"></label><div class="pills"><span class="pill active">${L('الكل', 'All')} <span class="n">6</span></span><span class="pill">${L('بتوعنا', 'Ours')} <span class="n">4</span></span><span class="pill">${L('من GoLive', 'GoLive library')} <span class="n">2</span></span></div></div>
        <div class="tpls">${TP.map(t => `<article class="card tpl ${t[9] ? 'on' : ''}">
          <div class="row between start gap-3"><span class="ic-tile" style="${t[1] ? ui.tone[t[1]] : ''}">${icon(t[0])}</span>${t[9] ? ui.tag('brand', L('افتراضي', 'Default'), false) : `<button class="icon-btn sm">${icon('more')}</button>`}</div>
          <div><div class="t">${t[2]}</div><div class="d">${t[3]}</div></div>
          <div class="phs">${Array.from({ length: t[4] }, () => '<i></i>').join('')}</div>
          <div class="st"><span>${icon('layers', 'xs')}${t[4]} ${L('مراحل', 'phases')}</span><span>${icon('list-checks', 'xs')}${t[5]} ${L('مهمة', 'tasks')}</span><span>${icon('clipboard-list', 'xs')}${t[6]} ${L('متطلب', 'reqs')}</span><span>${icon('clock', 'xs')}${t[8]}</span></div>
          <div class="row between t-cap muted"><span>${L(`استُخدم في ${t[7]} مشاريع`, `Used in ${t[7]} projects`)}</span></div>
        </article>`).join('')}</div>
      </div>
      <aside class="span-5 card sticky">
        <div class="card-head bordered"><div><h3 class="t-h3">${L('Odoo ERP قياسي', 'Odoo ERP standard')}</h3><p class="sub">${L('آخر تعديل من منى عادل · من أسبوع', 'Last edited by Mona Adel · 1 week ago')}</p></div><div class="row gap-2"><button class="btn btn-outline btn-sm">${icon('pencil')}${L('تعديل', 'Edit')}</button><button class="btn btn-primary btn-sm">${icon('rocket')}${L('استخدم', 'Use')}</button></div></div>
        <div class="card-body">
          ${phases.map((p, i) => `<div class="ph-acc"><div class="ph-h"><span class="num">${i + 1}</span><span class="t">${p[0]}</span><span class="c">${p[1]} ${L('مهمة', 'tasks')} · ${p[2]} ${L('متطلب', 'reqs')}</span>${icon(p[3] ? 'chevron-down' : 'chevron-right', 'sm ' + (p[3] ? '' : 'flip'))}</div>
            ${p[3] ? `<div class="ph-b">${p[3].map(t => `<div class="ti">${icon(t[1] === 'approval' ? 'file-pen-line' : t[1] === 'form' ? 'clipboard-list' : 'square-check-big')}<span>${t[0]}</span>${ui.tag(kind[t[1]][0], kind[t[1]][1], false)}</div>`).join('')}</div>` : ''}</div>`).join('')}
          <div class="callout info mt-4">${icon('info', 'sm')}<span>${L('المتطلبات من نوع «نموذج للعميل» بتظهر تلقائيًا في بوابة العميل لما المرحلة تبدأ.', '“Client form” items appear automatically in the client portal when their phase starts.')}</span></div>
        </div>
      </aside>
    </section>`;
  }
});
</script>
</body>
</html>
